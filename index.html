<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9fc5">

<title>幸运气球派对</title>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at 50% 5%, #fff 0%, #ffe9f2 22%, transparent 48%),
        linear-gradient(
            180deg,
            #ffb5d1 0%,
            #ff9fc5 32%,
            #ffb9d5 70%,
            #ffd7e7 100%
        );

    color:#8d4265;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
}

/* 背景闪光 */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 12%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 55%, rgba(255,255,255,.75) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 64%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 88%, rgba(255,255,255,.7) 0 2px, transparent 3px);

    opacity:.9;
}


/* =========================
   主容器
========================= */

.app{
    width:100%;
    max-width:980px;
    margin:0 auto;

    min-height:100vh;
    min-height:100dvh;

    padding:
        max(20px, env(safe-area-inset-top))
        14px
        max(28px, env(safe-area-inset-bottom));

    position:relative;
}


/* =========================
   两侧幕布
========================= */

.curtain{
    position:fixed;
    top:0;
    bottom:0;
    width:90px;

    pointer-events:none;
    z-index:0;

    background:
        linear-gradient(
            90deg,
            #d83c79 0%,
            #f56e9e 20%,
            #ff9fc4 48%,
            #ef5c94 72%,
            #c9316c 100%
        );

    opacity:.72;

    box-shadow:
        inset -8px 0 15px rgba(150,25,75,.18);
}

.curtain.left{
    left:0;
    border-radius:0 0 40px 0;
}

.curtain.right{
    right:0;
    transform:scaleX(-1);
    border-radius:0 0 40px 0;
}


/* =========================
   顶部灯光
========================= */

.lights{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    width:min(680px,82vw);

    display:flex;
    justify-content:space-between;

    z-index:2;
}

.lights span{
    width:8px;
    height:8px;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 15px rgba(255,255,255,.9);

    animation:blink 1.5s infinite alternate;
}

.lights span:nth-child(2){animation-delay:.15s}
.lights span:nth-child(3){animation-delay:.3s}
.lights span:nth-child(4){animation-delay:.45s}
.lights span:nth-child(5){animation-delay:.6s}
.lights span:nth-child(6){animation-delay:.75s}
.lights span:nth-child(7){animation-delay:.9s}
.lights span:nth-child(8){animation-delay:1.05s}

@keyframes blink{
    from{opacity:.45;transform:scale(.8)}
    to{opacity:1;transform:scale(1.25)}
}


/* =========================
   音效按钮
========================= */

.sound{
    position:absolute;
    top:48px;
    right:20px;

    width:45px;
    height:45px;

    border:2px solid rgba(255,255,255,.85);
    border-radius:50%;

    background:rgba(255,255,255,.55);

    box-shadow:
        0 5px 15px rgba(150,45,90,.15),
        inset 0 1px 0 white;

    font-size:20px;

    cursor:pointer;
    z-index:20;
}

.sound:active{
    transform:scale(.9);
}


/* =========================
   Hero
========================= */

.hero{
    position:relative;
    z-index:2;

    text-align:center;

    padding-top:32px;
}

.crown{
    font-size:38px;

    filter:
        drop-shadow(0 4px 3px rgba(150,60,90,.2));

    animation:
        crownFloat 2.2s ease-in-out infinite;
}

@keyframes crownFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
}

.badge{
    display:inline-block;

    margin-top:3px;
    padding:7px 18px;

    border-radius:30px;

    color:white;

    font-size:11px;
    font-weight:900;
    letter-spacing:2px;

    background:
        linear-gradient(
            180deg,
            #ffb5d4,
            #ed6e9e
        );

    border:2px solid rgba(255,255,255,.75);

    box-shadow:
        0 5px 15px rgba(150,40,85,.16),
        inset 0 1px 0 rgba(255,255,255,.9);
}

h1{
    margin:9px 0 4px;

    font-size:
        clamp(30px, 8vw, 52px);

    line-height:1.05;

    font-weight:1000;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
        0 3px 0 #ed709f,
        0 6px 12px rgba(142,45,86,.24);
}

.hero p{
    margin:8px 0 0;

    color:#fff;

    font-size:
        clamp(13px,3.5vw,16px);

    font-weight:700;

    text-shadow:
        0 2px 4px rgba(130,50,80,.18);
}


/* =========================
   数据面板
========================= */

.stage{
    position:relative;
    z-index:3;

    margin:18px auto 13px;

    width:min(760px,100%);

    padding:12px;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.82),
            rgba(255,239,247,.82)
        );

    border:2px solid rgba(255,255,255,.85);

    box-shadow:
        0 12px 30px rgba(150,50,90,.15),
        inset 0 1px 0 white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:5px;

    border-radius:15px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff0f7
        );

    color:#a84d74;

    font-size:12px;
    font-weight:800;

    box-shadow:
        inset 0 1px 0 white;
}

.stat span{
    margin-left:3px;
    font-size:17px;
    color:#e95d91;
    font-weight:1000;
}

.progress{
    height:9px;

    margin:10px 3px 7px;

    border-radius:20px;

    background:#ffd8e8;

    overflow:hidden;

    box-shadow:
        inset 0 2px 4px rgba(160,50,90,.1);
}

.progress i{
    display:block;

    width:0%;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #f36d9e,
            #ff9dc1,
            #ef6b9b
        );

    box-shadow:
        0 0 8px rgba(240,90,145,.5);

    transition:width .4s ease;
}

.helper{
    text-align:center;

    font-size:12px;
    font-weight:800;

    color:#ba6388;
}


/* =========================
   气球区域
========================= */

.balloon-board{
    position:relative;
    z-index:3;

    width:min(760px,100%);

    margin:0 auto;

    padding:
        15px
        clamp(8px,2vw,20px)
        19px;

    border-radius:32px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.75),
            rgba(255,240,247,.85) 55%,
            rgba(255,220,235,.92)
        );

    border:3px solid rgba(255,255,255,.8);

    box-shadow:
        0 16px 35px rgba(150,45,90,.18),
        inset 0 1px 0 white;
}

.board-title{
    text-align:center;

    margin-bottom:8px;
}

.board-title span{
    display:inline-block;

    padding:6px 15px;

    border-radius:20px;

    background:rgba(255,255,255,.7);

    color:#d55789;

    font-size:13px;
    font-weight:900;

    box-shadow:
        0 4px 10px rgba(170,60,100,.08);
}


/* =========================
   16个气球
========================= */

.balloons{
    display:grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap:
        clamp(7px,2.2vw,18px)
        clamp(5px,2vw,15px);

    padding:
        6px
        clamp(2px,1vw,8px)
        4px;
}


/* 气球外层 */

.balloon{
    position:relative;

    height:
        clamp(126px, 18vw, 175px);

    display:flex;
    justify-content:center;
    align-items:flex-start;

    cursor:pointer;

    user-select:none;

    perspective:500px;

    transition:
        transform .18s ease,
        filter .18s ease;
}

.balloon:not(.pop):active{
    transform:scale(.92);
}


/* =========================
   超大饱满气球
========================= */

.balloon-body{

    position:relative;

    width:
        clamp(78px, 17vw, 116px);

    height:
        clamp(96px, 20vw, 142px);

    margin-top:2px;

    border-radius:
        53%
        53%
        49%
        49%
        /
        47%
        47%
        55%
        55%;

    background:

        radial-gradient(
            ellipse at 29% 20%,
            rgba(255,255,255,.98) 0%,
            rgba(255,255,255,.62) 8%,
            rgba(255,255,255,.08) 20%,
            transparent 28%
        ),

        radial-gradient(
            ellipse at 68% 72%,
            rgba(197,35,91,.22),
            transparent 52%
        ),

        linear-gradient(
            135deg,
            #ffb9d4 0%,
            #ff8fba 28%,
            #f65f99 58%,
            #e94b88 78%,
            #cf3273 100%
        );

    border:
        2px solid rgba(255,255,255,.72);

    box-shadow:

        inset
        -9px -12px 18px
        rgba(157,24,75,.20),

        inset
        8px 8px 15px
        rgba(255,255,255,.42),

        0 9px 13px
        rgba(150,35,85,.20);

    transform:
        rotate(var(--rotate,0deg));

    animation:
        balloonFloat 3s ease-in-out infinite;

    transition:
        transform .25s ease,
        filter .25s ease;
}


/* 左右高光 */

.balloon-body::before{
    content:"";

    position:absolute;

    left:16%;
    top:10%;

    width:18%;
    height:42%;

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.92),
            rgba(255,255,255,.12)
        );

    transform:rotate(14deg);

    filter:blur(.3px);
}

.balloon-body::after{
    content:"";

    position:absolute;

    right:14%;
    top:18%;

    width:8%;
    height:22%;

    border-radius:50%;

    background:
        rgba(255,255,255,.48);

    filter:blur(1px);
}


/* 不同气球轻微旋转 */

.balloon:nth-child(4n+1){
    --rotate:-3deg;
}

.balloon:nth-child(4n+2){
    --rotate:2deg;
    animation-delay:.35s;
}

.balloon:nth-child(4n+3){
    --rotate:-1deg;
    animation-delay:.7s;
}

.balloon:nth-child(4n){
    --rotate:3deg;
    animation-delay:1s;
}

@keyframes balloonFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-4px;
    }
}


/* =========================
   气球底部
========================= */

.knot{
    position:absolute;

    top:
        clamp(94px, 19.5vw, 140px);

    width:17px;
    height:22px;

    background:
        linear-gradient(
            135deg,
            #ef6b9b,
            #c93470
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    filter:
        drop-shadow(
            0 2px 2px
            rgba(130,30,70,.2)
        );

    z-index:2;
}


/* =========================
   蝴蝶结
========================= */

.bow{
    position:absolute;

    top:
        clamp(104px, 21vw, 151px);

    width:36px;
    height:18px;

    z-index:4;
}

.bow::before,
.bow::after{
    content:"";

    position:absolute;

    top:1px;

    width:20px;
    height:16px;

    background:
        linear-gradient(
            135deg,
            #ff9fc4,
            #df3f78
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.6);
}

.bow::before{
    left:0;

    border-radius:
        90% 15% 70% 30%;
}

.bow::after{
    right:0;

    border-radius:
        15% 90% 30% 70%;
}

.bow-dot{
    position:absolute;

    left:50%;
    top:3px;

    transform:translateX(-50%);

    width:12px;
    height:12px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ff77a9 35%,
            #d93370
        );

    z-index:5;
}


/* =========================
   气球绳
========================= */

.string{
    position:absolute;

    top:
        clamp(118px, 23vw, 167px);

    width:1.5px;

    height:17px;

    background:
        linear-gradient(
            180deg,
            #db6390,
            rgba(255,255,255,.7)
        );

    z-index:1;
}


/* =========================
   奖励数字
========================= */

.reward{

    position:absolute;

    left:50%;
    top:42%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    z-index:10;

    min-width:54px;

    padding:7px 10px;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #fffdfd,
            #fff0f7
        );

    color:#e34e87;

    border:2px solid white;

    font-size:
        clamp(12px,3vw,15px);

    font-weight:1000;

    box-shadow:
        0 5px 16px rgba(130,30,75,.2),
        0 0 14px rgba(255,255,255,.8);

    pointer-events:none;
}

.balloon.revealed .reward{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    transition:
        .35s cubic-bezier(.17,.89,.32,1.5);
}


/* =========================
   爆开
========================= */

.balloon.pop .balloon-body{

    animation:
        balloonPop .42s forwards;
}

.balloon.pop .knot,
.balloon.pop .bow,
.balloon.pop .string{

    animation:
        fadeAway .28s forwards;
}

@keyframes balloonPop{

    0%{
        transform:scale(1) rotate(var(--rotate));
        opacity:1;
    }

    45%{
        transform:scale(1.18) rotate(var(--rotate));
        opacity:.8;
    }

    100%{
        transform:scale(.05) rotate(var(--rotate));
        opacity:0;
    }
}

@keyframes fadeAway{

    to{
        opacity:0;
    }
}


/* =========================
   闪光粒子
========================= */

.spark{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:100;

    box-shadow:
        0 0 10px white,
        0 0 18px #ff75a8;

    animation:
        sparkFly .7s ease-out forwards;
}

@keyframes sparkFly{

    from{
        transform:
            translate(0,0)
            scale(1);
        opacity:1;
    }

    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity:0;
    }
}


/* =========================
   下方提示
========================= */

.note{
    position:relative;
    z-index:3;

    text-align:center;

    margin:11px auto;

    color:#fff;

    font-size:12px;
    font-weight:800;

    text-shadow:
        0 2px 4px rgba(120,40,75,.18);
}


/* =========================
   开奖按钮
========================= */

.gift{
    position:relative;
    z-index:4;

    display:block;

    width:min(420px,90%);

    margin:10px auto 0;

    padding:14px 22px;

    border:0;

    border-radius:30px;

    color:white;

    font-size:15px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #ff9fc5,
            #e9568c
        );

    box-shadow:
        0 7px 0 #c83a72,
        0 13px 22px rgba(130,35,75,.22),
        inset 0 1px 0 rgba(255,255,255,.8);

    cursor:pointer;
}

.gift:active{
    transform:translateY(5px);

    box-shadow:
        0 2px 0 #c83a72,
        0 7px 13px rgba(130,35,75,.18);
}

.gift:disabled{
    opacity:.55;
}


/* =========================
   Footer
========================= */

.footer{
    position:relative;
    z-index:3;

    text-align:center;

    margin-top:16px;

    color:rgba(255,255,255,.9);

    font-size:11px;
    font-weight:700;
}


/* =========================
   结果弹窗
========================= */

.overlay{

    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(111,25,65,.42);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.overlay.show{

    opacity:1;
    visibility:visible;
}

.result{

    width:min(430px,92vw);

    padding:
        27px
        22px
        24px;

    border-radius:32px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff1f7
        );

    border:3px solid white;

    box-shadow:
        0 25px 60px rgba(80,15,45,.3);

    transform:
        scale(.7)
        translateY(30px);

    transition:
        transform .45s cubic-bezier(.17,.89,.32,1.35);
}

.overlay.show .result{

    transform:
        scale(1)
        translateY(0);
}

.result .emoji{
    font-size:42px;
}

.result h2{
    margin:7px 0;

    color:#df4d83;

    font-size:26px;
    font-weight:1000;
}

.result p{
    margin:0 0 17px;

    color:#a85a79;

    font-size:12px;
    font-weight:700;
}

.totalBox{

    padding:17px;

    border-radius:22px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe3ef
        );

    border:2px solid #ffc1d9;

    color:#b25177;

    font-size:14px;
    font-weight:800;
}

.totalBox strong{

    display:inline-block;

    margin-top:3px;

    color:#e64d86;

    font-size:48px;

    line-height:1;

    text-shadow:
        0 3px 5px rgba(180,45,90,.15);
}

.again{

    width:100%;

    margin-top:16px;

    padding:13px;

    border:0;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            #ff9fc4,
            #e9588c
        );

    color:white;

    font-size:15px;
    font-weight:1000;

    box-shadow:
        0 5px 0 #c63b72,
        0 9px 18px rgba(150,40,85,.18);

    cursor:pointer;
}

.again:active{
    transform:translateY(4px);

    box-shadow:
        0 1px 0 #c63b72;
}


/* =========================
   彩纸
========================= */

.confetti{

    position:fixed;

    top:-15px;

    width:8px;
    height:13px;

    z-index:300;

    animation:
        confettiFall
        var(--duration)
        linear
        forwards;

    pointer-events:none;
}

@keyframes confettiFall{

    to{
        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(
                720deg
            );

        opacity:.8;
    }
}


/* =========================
   小屏 iPhone
========================= */

@media(max-width:390px){

    .app{
        padding-left:8px;
        padding-right:8px;
    }

    .curtain{
        width:55px;
    }

    .hero{
        padding-top:28px;
    }

    h1{
        font-size:30px;
        letter-spacing:2px;
    }

    .stats{
        gap:5px;
    }

    .stat{
        font-size:10px;
        min-height:44px;
    }

    .stat span{
        font-size:15px;
    }

    .balloons{
        gap:5px 3px;
    }

    .balloon{
        height:116px;
    }

    .balloon-body{
        width:72px;
        height:91px;
    }

    .knot{
        top:89px;
    }

    .bow{
        top:97px;
    }

    .string{
        top:111px;
    }

    .gift{
        font-size:14px;
    }
}


/* =========================
   更大的手机
========================= */

@media(min-width:600px){

    .balloon{
        height:185px;
    }

    .balloon-body{
        width:120px;
        height:148px;
    }

    .knot{
        top:145px;
    }

    .bow{
        top:155px;
    }

    .string{
        top:172px;
    }
}

</style>
</head>


<body>

<div class="app">

    <!-- 顶部灯光 -->
    <div class="lights">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 两侧幕布 -->
    <div class="curtain left"></div>
    <div class="curtain right"></div>


    <!-- 音效 -->
    <button
        class="sound"
        id="sound"
        aria-label="声音">
        🔊
    </button>


    <!-- 标题 -->

    <header class="hero">

        <div class="crown">
            👑
        </div>

        <div class="badge">
            🎀 TODAY'S LUCKY 🎀
        </div>

        <h1>
            幸运气球派对
        </h1>

        <p>
            选择 10 个气球，看看今天能获得多少钻石！
        </p>

    </header>


    <!-- 数据 -->

    <section class="stage">

        <div class="stats">

            <div class="stat">
                本局钻石 💎
                <span id="total">0</span>
            </div>

            <div class="stat">
                已选择
                <span id="count">0</span>/10
            </div>

            <div class="stat">
                单颗最高 💎
                <span>100</span>
            </div>

        </div>


        <div class="progress">
            <i id="bar"></i>
        </div>


        <div
            class="helper"
            id="helper">

            从下面 16 个气球中任选 10 个 ✨

        </div>

    </section>


    <!-- 气球区域 -->

    <section class="balloon-board">

        <div class="board-title">
            <span>
                🎈 挑选你的幸运气球 🎈
            </span>
        </div>

        <div
            class="balloons"
            id="balloons">
        </div>

    </section>


    <div class="note">
        💗 每选一个气球，都有机会获得钻石哦~ 💗
    </div>


    <button
        class="gift"
        id="gift">

        🎁 选择 10 个气球开奖

    </button>


    <div class="footer">
        🎀 幸运气球派对 · 愿你今天好运满满 🎀
    </div>

</div>


<!-- 最终结果 -->

<div
    class="overlay"
    id="overlay">

    <div class="result">

        <div class="emoji">
            👑🎉🎈
        </div>

        <h2>
            恭喜你，幸运星！
        </h2>

        <p>
            10 个气球全部打开啦 · 今天的好运爆棚！
        </p>

        <div class="totalBox">

            本轮一共获得

            <br>

            <strong id="finalTotal">
                0
            </strong>

            💎

        </div>


        <button
            class="again"
            id="again">

            再来一轮 🎈

        </button>

    </div>

</div>


<script>

/* =========================
   游戏数据
========================= */

const rewards = [
    1,
    5,
    10,
    20,
    30,
    50,
    70,
    100
];

let selected = 0;
let total = 0;

let soundOn = true;
let audio = null;


/* =========================
   DOM
========================= */

const balloonsBox =
    document.getElementById("balloons");

const countEl =
    document.getElementById("count");

const totalEl =
    document.getElementById("total");

const bar =
    document.getElementById("bar");

const helper =
    document.getElementById("helper");

const gift =
    document.getElementById("gift");

const overlay =
    document.getElementById("overlay");

const finalTotal =
    document.getElementById("finalTotal");

const again =
    document.getElementById("again");

const soundButton =
    document.getElementById("sound");


/* =========================
   音效系统
========================= */

function audioCtx(){

    if(!soundOn) return;

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audio.state === "suspended"){

        audio.resume();

    }

}


function playTone(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    if(!soundOn) return;

    audioCtx();

    if(!audio) return;

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );
}


function clickSound(){

    playTone(
        500,
        .08,
        "sine",
        .045
    );

}


function rewardSound(){

    playTone(
        720,
        .12,
        "sine",
        .05
    );

    setTimeout(()=>{
        playTone(
            980,
            .18,
            "sine",
            .045
        );
    },70);

}


function victorySound(){

    if(!soundOn) return;

    [
        [523,.0],
        [659,.12],
        [784,.24],
        [1046,.38]
    ].forEach(([freq,delay])=>{

        setTimeout(()=>{

            playTone(
                freq,
                .28,
                "sine",
                .07
            );

        },delay * 1000);

    });

}


/* =========================
   震动
========================= */

function vibrate(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            12
        );

    }

}


/* =========================
   创建气球
========================= */

function createBalloon(){

    const balloon =
        document.createElement("div");

    balloon.className =
        "balloon";


    const body =
        document.createElement("div");

    body.className =
        "balloon-body";


    const knot =
        document.createElement("div");

    knot.className =
        "knot";


    const bow =
        document.createElement("div");

    bow.className =
        "bow";


    const bowDot =
        document.createElement("div");

    bowDot.className =
        "bow-dot";


    const string =
        document.createElement("div");

    string.className =
        "string";


    const reward =
        document.createElement("div");

    reward.className =
        "reward";


    bow.appendChild(
        bowDot
    );


    balloon.appendChild(
        body
    );

    balloon.appendChild(
        reward
    );

    balloon.appendChild(
        knot
    );

    balloon.appendChild(
        bow
    );

    balloon.appendChild(
        string
    );


    balloon.addEventListener(
        "click",
        ()=>pickBalloon(balloon)
    );


    return balloon;
}


/* =========================
   创建16个
========================= */

function makeBalloons(){

    balloonsBox.innerHTML="";

    for(
        let i=0;
        i<16;
        i++
    ){

        balloonsBox.appendChild(
            createBalloon()
        );

    }

}


/* =========================
   点击气球
========================= */

function pickBalloon(balloon){

    if(
        selected >= 10
    ) return;


    if(
        balloon.classList.contains("pop")
    ) return;


    audioCtx();

    vibrate();


    selected++;


    const reward =
        rewards[
            Math.floor(
                Math.random() *
                rewards.length
            )
        ];


    total += reward;


    const rewardEl =
        balloon.querySelector(
            ".reward"
        );


    rewardEl.textContent =
        "💎 " + reward;


    balloon.classList.add(
        "revealed"
    );


    setTimeout(()=>{

        balloon.classList.add(
            "pop"
        );

    },280);


    clickSound();


    setTimeout(
        rewardSound,
        80
    );


    createSparks(
        balloon
    );


    update();


    if(
        selected === 10
    ){

        gift.disabled = true;

        helper.textContent =
            "🎉 10 个幸运气球已经全部开启！";

        setTimeout(
            showResult,
            900
        );

    }

}


/* =========================
   更新UI
========================= */

function update(){

    countEl.textContent =
        selected;

    totalEl.textContent =
        total;

    bar.style.width =
        (selected / 10 * 100) + "%";


    if(
        selected < 10
    ){

        helper.textContent =
            `还可以选择 ${10-selected} 个气球 ✨`;

    }

}


/* =========================
   闪光
========================= */

function createSparks(balloon){

    const rect =
        balloon.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height * .4;


    for(
        let i=0;
        i<14;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";


        spark.style.left =
            centerX + "px";

        spark.style.top =
            centerY + "px";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            35 +
            Math.random() *
            65;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            spark
        );


        setTimeout(
            ()=>{
                spark.remove();
            },
            800
        );

    }

}


/* =========================
   最终结果
========================= */

function showResult(){

    finalTotal.textContent =
        total;

    overlay.classList.add(
        "show"
    );

    victorySound();

    vibrate();

    createConfetti();

}


/* =========================
   彩纸
========================= */

function createConfetti(){

    for(
        let i=0;
        i<55;
        i++
    ){

        const confetti =
            document.createElement(
                "div"
            );

        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() *
            100 +
            "vw";


        confetti.style.setProperty(
            "--x",
            (
                Math.random()*200 -
                100
            ) + "px"
        );


        confetti.style.setProperty(
            "--duration",
            (
                1.8 +
                Math.random()*2
            ) + "s"
        );


        confetti.style.background =
            [
                "#ff6f9f",
                "#ff9fc5",
                "#ffd36f",
                "#fff",
                "#d85bff"
            ][
                Math.floor(
                    Math.random()*5
                )
            ];


        confetti.style.transform =
            `rotate(${Math.random()*360}deg)`;


        document.body.appendChild(
            confetti
        );


        setTimeout(
            ()=>{
                confetti.remove();
            },
            4500
        );

    }

}


/* =========================
   再来一局
========================= */

function resetGame(){

    selected = 0;

    total = 0;

    gift.disabled = false;

    overlay.classList.remove(
        "show"
    );

    makeBalloons();

    update();

}


/* =========================
   按钮
========================= */

gift.addEventListener(
    "click",
    ()=>{

        if(selected === 10){

            showResult();

        }

    }
);


again.addEventListener(
    "click",
    resetGame
);


soundButton.addEventListener(
    "click",
    ()=>{

        soundOn =
            !soundOn;

        soundButton.textContent =
            soundOn
            ? "🔊"
            : "🔇";


        if(soundOn){

            audioCtx();

            playTone(
                700,
                .1
            );

        }

    }
);


/* =========================
   初始化
========================= */

makeBalloons();

update();


/* 防止双击缩放 */

document.addEventListener(
    "dblclick",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

</script>

</body>
</html>
