<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💗 幸运气球游戏</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #ffeef5);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ff4f91;
}

.game {
  width: 95%;
  max-width: 600px;
  background: rgba(255,255,255,0.92);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(255,80,140,0.2);
  text-align: center;
}

h1 {
  margin-top: 0;
  color: #ff4f91;
}

.diamond-box {
  background: #fff0f6;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 20px;
  font-size: 20px;
  font-weight: bold;
}

#diamond {
  color: #e83282;
  font-size: 28px;
}

.balloons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.balloon {
  height: 75px;
  border-radius: 50% 50% 45% 45%;
  border: none;
  background: linear-gradient(145deg, #ff8fbd, #ff4f91);
  color: white;
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 5px 10px rgba(255,70,130,0.25);
  transition: 0.2s;
  position: relative;
}

.balloon::after {
  content: "";
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 15px;
  background: #ff669d;
}

.balloon:hover {
  transform: translateY(-5px) scale(1.04);
}

.balloon.opened {
  background: #ddd;
  cursor: default;
  transform: scale(0.95);
  box-shadow: none;
}

.balloon.opened::after {
  display: none;
}

.progress {
  font-size: 16px;
  color: #777;
  margin-bottom: 15px;
}

.reset-btn {
  border: none;
  padding: 12px 25px;
  border-radius: 30px;
  background: #ff4f91;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.reset-btn:hover {
  background: #e83282;
}


/* =========================
   倍率卡弹窗
========================= */

.multiplier-overlay {
  position: fixed;
  inset: 0;

  background: rgba(255, 90, 150, 0.35);
  backdrop-filter: blur(8px);

  display: none;

  justify-content: center;
  align-items: center;

  z-index: 999;
}

.multiplier-overlay.show {
  display: flex;
}

.multiplier-box {
  width: 92%;
  max-width: 600px;

  background: white;

  border-radius: 25px;

  padding: 25px 20px;

  text-align: center;

  box-shadow: 0 20px 60px rgba(0,0,0,0.2);

  animation: popup 0.35s ease;
}

@keyframes popup {

  from {
    transform: scale(0.7);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}

.multiplier-box h2 {
  margin: 0 0 10px;
  color: #ff4f91;
  font-size: 27px;
}

.multiplier-subtitle {
  color: #777;
  line-height: 1.6;
}

.current-total {
  margin: 15px auto 20px;

  background: #fff1f7;

  padding: 12px;

  border-radius: 15px;

  font-size: 19px;

  font-weight: bold;
}

#currentTotal {
  color: #e83282;
  font-size: 25px;
}


/* =========================
   卡牌
========================= */

.cards {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 12px;

  perspective: 1000px;
}

.card {
  height: 145px;

  cursor: pointer;

  perspective: 1000px;
}

.card-inner {
  width: 100%;
  height: 100%;

  position: relative;

  transform-style: preserve-3d;

  transition: transform 0.7s;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {

  position: absolute;

  inset: 0;

  border-radius: 18px;

  backface-visibility: hidden;

  display: flex;

  justify-content: center;

  align-items: center;

  font-weight: bold;

  box-shadow: 0 5px 15px rgba(255,80,140,0.2);
}


/* =========================
   卡牌背面
   未选择时只能看到这个
========================= */

.card-front {

  background:
    linear-gradient(
      145deg,
      #ff6da8,
      #ff3f87
    );

  color: white;

  font-size: 42px;

  overflow: hidden;

}


/* 卡牌装饰 */

.card-front::before {

  content: "♥";

  position: absolute;

  font-size: 90px;

  opacity: 0.12;

  transform: rotate(-15deg);

}


/* =========================
   卡牌正面
   只有选中后才显示
========================= */

.card-back {

  transform: rotateY(180deg);

  background:
    linear-gradient(
      145deg,
      #fff,
      #ffeaf3
    );

  color: #ff3f87;

  flex-direction: column;

  font-size: 27px;

}

.card-back small {

  margin-top: 5px;

  font-size: 13px;

  color: #999;

}


/* 已选择卡 */

.card.selected {

  transform: scale(1.05);

}


/* 其他卡牌 */

.card.disabled {

  cursor: default;

  opacity: 0.55;

}

.card.disabled .card-inner {

  filter: grayscale(0.2);

}


/* 卡牌提示 */

.card-tip {

  margin: 18px 0 0;

  font-size: 13px;

  color: #999;

}


/* =========================
   结果
========================= */

.result {

  display: none;

  margin-top: 20px;

  background: #fff0f6;

  border-radius: 18px;

  padding: 18px;

}

.result.show {

  display: block;

}

.result-title {

  font-size: 18px;

  color: #777;

}

.result-multiplier {

  font-size: 35px;

  font-weight: bold;

  color: #ff3f87;

  margin: 8px 0;

}

.result-total {

  font-size: 25px;

  font-weight: bold;

  color: #e83282;

}

.next-btn {

  margin-top: 15px;

  border: none;

  padding: 12px 30px;

  border-radius: 30px;

  background: #ff4f91;

  color: white;

  font-size: 17px;

  cursor: pointer;

}

.next-btn:hover {

  background: #e83282;

}


/* =========================
   手机
========================= */

@media (max-width: 500px) {

  .balloons {

    grid-template-columns: repeat(5, 1fr);

    gap: 7px;

  }

  .balloon {

    height: 60px;

    font-size: 23px;

  }

  .cards {

    grid-template-columns: repeat(2, 1fr);

  }

  .card {

    height: 125px;

  }

}

</style>

</head>

<script>


/* =====================================================
   游戏设置
===================================================== */


/*
   每一局开始的钻石

   想改成其他数字可以直接修改这里
*/

const START_DIAMOND = 30;



/*
   倍率卡

   1 = 1倍
   1.5 = 1.5倍
   2 = 2倍
   0.5 = 除2
*/

const multipliers = [

  1,

  1.5,

  2,

  0.5

];



/* =====================================================
   游戏变量
===================================================== */

let diamond = START_DIAMOND;

let openedCount = 0;

let currentTotal = 0;

let gameFinished = false;

let cardSelected = false;



/* =====================================================
   初始化游戏
===================================================== */

function initGame() {


  /*
     每次开始新游戏
     都重新设置为30钻石
  */

  diamond = START_DIAMOND;


  openedCount = 0;

  gameFinished = false;

  cardSelected = false;

  currentTotal = 0;


  document.getElementById("diamond")
    .textContent = formatNumber(diamond);


  document.getElementById("openedCount")
    .textContent = "0";


  document.getElementById("multiplierOverlay")
    .classList.remove("show");


  document.getElementById("result")
    .classList.remove("show");


  createBalloons();

}



/* =====================================================
   创建10个气球
===================================================== */

function createBalloons() {


  const container =
    document.getElementById("balloons");


  container.innerHTML = "";


  for (
    let i = 0;
    i < 10;
    i++
  ) {


    const balloon =
      document.createElement("button");


    balloon.className = "balloon";


    balloon.textContent = "🎈";


    balloon.dataset.index = i;


    balloon.addEventListener(
      "click",
      openBalloon
    );


    container.appendChild(balloon);

  }

}



/* =====================================================
   打开气球
===================================================== */

function openBalloon(event) {


  if (gameFinished) {

    return;

  }


  const balloon =
    event.currentTarget;


  if (
    balloon.classList.contains("opened")
  ) {

    return;

  }


  balloon.classList.add("opened");


  balloon.textContent = "💥";


  openedCount++;


  document.getElementById("openedCount")
    .textContent = openedCount;



  /*
     10个全部打开
  */

  if (openedCount >= 10) {


    setTimeout(() => {

      openMultiplier();

    }, 500);

  }

}



/* =====================================================
   打开倍率卡
===================================================== */

function openMultiplier() {


  gameFinished = true;


  /*
     保存本局开始时的钻石
  */

  currentTotal = diamond;


  document.getElementById("currentTotal")
    .textContent =
      formatNumber(currentTotal);


  createCards();


  document.getElementById("multiplierOverlay")
    .classList.add("show");

}



/* =====================================================
   创建倍率卡
===================================================== */

function createCards() {


  const container =
    document.getElementById("cards");


  container.innerHTML = "";


  /*
     随机复制倍率
  */

  const shuffled =
    [...multipliers];


  shuffle(shuffled);



  shuffled.forEach((multiplier) => {


    const card =
      document.createElement("div");


    card.className = "card";


    /*
       不再把倍率放进HTML里面。

       倍率通过点击事件的闭包保存，
       所以卡牌表面完全不会出现倍率。
    */

    card.innerHTML = `

      <div class="card-inner">

        <div class="card-front">
          💗
        </div>

        <div class="card-back">

          <div class="card-value"></div>

          <small>
            幸运倍率
          </small>

        </div>

      </div>

    `;


    /*
       把倍率绑定到点击事件，
       而不是显示在卡牌HTML上。
    */

    card.addEventListener(
      "click",
      function() {

        selectCard(card, multiplier);

      }
    );


    container.appendChild(card);

  });

}



/* =====================================================
   点击卡牌
===================================================== */

function selectCard(card, multiplier) {


  if (cardSelected) {

    return;

  }


  cardSelected = true;


  /*
     显示倍率到被选择的卡牌
  */

  const value =
    card.querySelector(".card-value");


  value.textContent =
    formatMultiplier(multiplier);



  /*
     翻牌
  */

  card.classList.add("flipped");

  card.classList.add("selected");



  /*
     其他卡牌禁止点击
  */

  const allCards =
    document.querySelectorAll(".card");


  allCards.forEach(other => {


    if (other !== card) {

      other.classList.add("disabled");

    }

  });



  /*
     等待翻牌动画完成
  */

  setTimeout(() => {

    calculateResult(multiplier);

  }, 750);

}



/* =====================================================
   计算最终钻石
===================================================== */

function calculateResult(multiplier) {


  let finalDiamond;



  /*
     0.5 = 除2
  */

  if (multiplier === 0.5) {


    finalDiamond =
      currentTotal / 2;


  } else {


    finalDiamond =
      currentTotal * multiplier;

  }



  /*
     最多保留2位小数
  */

  finalDiamond =
    Math.round(
      finalDiamond * 100
    ) / 100;



  /*
     防止负数
  */

  if (finalDiamond < 0) {

    finalDiamond = 0;

  }



  /*
     更新本局钻石
  */

  diamond = finalDiamond;


  document.getElementById("diamond")
    .textContent =
      formatNumber(finalDiamond);



  /*
     显示倍率
  */

  document.getElementById("resultMultiplier")
    .textContent =
      formatMultiplier(multiplier);



  /*
     显示最终钻石
  */

  document.getElementById("resultTotal")
    .textContent =
      formatNumber(finalDiamond);



  /*
     显示结果
  */

  document.getElementById("result")
    .classList.add("show");

}



/* =====================================================
   下一局
===================================================== */

function nextRound() {


  /*
     重点：

     上一局钻石在这里彻底结束。

     下一局重新从30钻石开始。
  */

  diamond = START_DIAMOND;


  initGame();

}



/* =====================================================
   重新开始
===================================================== */

function resetGame() {


  /*
     重新开始也恢复30钻石
  */

  diamond = START_DIAMOND;


  initGame();

}



/* =====================================================
   随机打乱
===================================================== */

function shuffle(array) {


  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {


    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}



/* =====================================================
   倍率显示
===================================================== */

function formatMultiplier(multiplier) {


  if (multiplier === 0.5) {

    return "÷ 2";

  }


  if (multiplier === 1.5) {

    return "1.5 ×";

  }


  if (multiplier === 2) {

    return "2 ×";

  }


  return "1 ×";

}



/* =====================================================
   数字格式
===================================================== */

function formatNumber(number) {


  return Number(number)
    .toLocaleString("en-US", {

      maximumFractionDigits: 2

    });

}



/* =====================================================
   启动
===================================================== */

initGame();


</script>

</body>
