```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎈 可爱气球抽奖</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,.9) 0 35px, transparent 36px),
        radial-gradient(circle at 90% 18%, rgba(255,255,255,.7) 0 45px, transparent 46px),
        linear-gradient(180deg, #ffd8eb 0%, #fff1f8 50%, #ffe4f0 100%);
    color: #914f6e;
}

/* 背景装饰 */
.bg {
    position: fixed;
    pointer-events: none;
    opacity: .45;
    z-index: 0;
    animation: bgFloat 5s ease-in-out infinite;
}

.bg1 {
    left: 4%;
    top: 15%;
    font-size: 30px;
}

.bg2 {
    right: 5%;
    top: 30%;
    font-size: 28px;
    animation-delay: 1s;
}

.bg3 {
    left: 8%;
    bottom: 15%;
    font-size: 25px;
    animation-delay: 2s;
}

.bg4 {
    right: 10%;
    bottom: 12%;
    font-size: 32px;
    animation-delay: 3s;
}

@keyframes bgFloat {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-15px) rotate(5deg);
    }
}

.game {
    width: min(100%, 900px);
    margin: auto;
    padding: 25px 18px 40px;
    position: relative;
    z-index: 1;
}

/* 标题 */

.header {
    text-align: center;
    margin-bottom: 18px;
}

.title {
    font-size: clamp(35px, 7vw, 58px);
    font-weight: 900;
    color: #ff6fa8;
    letter-spacing: 3px;
    text-shadow:
        0 4px 0 white,
        0 7px 15px rgba(255,90,150,.25);
}

.subtitle {
    margin-top: 7px;
    font-size: 16px;
    color: #b96a88;
}

/* 音效按钮 */

.sound-btn {
    position: fixed;
    top: 18px;
    right: 20px;
    z-index: 50;
    border: 2px solid white;
    background: rgba(255,255,255,.8);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(190,70,120,.15);
    transition: .2s;
}

.sound-btn:hover {
    transform: scale(1.08);
}

.sound-btn:active {
    transform: scale(.94);
}

/* 状态 */

.status {
    width: min(100%, 650px);
    margin: 20px auto;
    padding: 13px 20px;
    border-radius: 22px;
    background: rgba(255,255,255,.78);
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 8px 25px rgba(216,101,145,.12);

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.counter {
    font-size: 17px;
    font-weight: 800;
}

.counter span {
    color: #ff5799;
    font-size: 23px;
}

.hint {
    font-size: 14px;
    color: #c07896;
}

/* 游戏区域 */

.balloon-area {
    width: min(100%, 780px);
    margin: auto;
    padding: 30px 25px 35px;
    border-radius: 35px;

    background: rgba(255,255,255,.5);

    border: 3px solid rgba(255,255,255,.75);

    box-shadow:
        0 15px 40px rgba(206,91,139,.12),
        inset 0 0 30px rgba(255,255,255,.5);
}

/* 气球 */

.balloons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px 20px;
    justify-items: center;
}

.balloon {
    width: 105px;
    height: 138px;
    position: relative;
    cursor: pointer;
    user-select: none;

    animation: balloonFloat 3s ease-in-out infinite;

    transition: transform .2s;
}

.balloon:nth-child(2n) {
    animation-delay: -.7s;
}

.balloon:nth-child(3n) {
    animation-delay: -1.4s;
}

.balloon:nth-child(4n) {
    animation-delay: -2s;
}

.balloon:hover {
    transform: translateY(-8px) scale(1.05);
}

/* 气球主体 */

.balloon-body {
    position: absolute;

    width: 88px;
    height: 112px;

    left: 8px;
    top: 0;

    border-radius:
        52% 48% 47% 53%
        / 42% 42% 58% 58%;

    transform: rotate(-3deg);

    background:
        linear-gradient(
            135deg,
            #ffc2dc 0%,
            #ff91bd 45%,
            #ff67a5 100%
        );

    box-shadow:
        inset -10px -13px 15px rgba(214,57,116,.16),
        inset 9px 8px 13px rgba(255,255,255,.55),
        0 8px 15px rgba(205,80,132,.2);
}

.balloon:nth-child(2n) .balloon-body {
    background:
        linear-gradient(
            135deg,
            #ffd6e8,
            #ffa7ca 48%,
            #ff79b2
        );
}

.balloon:nth-child(3n) .balloon-body {
    background:
        linear-gradient(
            135deg,
            #ffc9e0,
            #ff86b8 48%,
            #ff62a4
        );
}

/* 高光 */

.balloon-body::before {
    content: "";

    position: absolute;

    width: 20px;
    height: 38px;

    left: 17px;
    top: 15px;

    border-radius: 50%;

    background: rgba(255,255,255,.55);

    transform: rotate(18deg);
}

/* 爱心 */

.balloon-body::after {
    content: "♥";

    position: absolute;

    right: 14px;
    bottom: 20px;

    color: rgba(255,255,255,.55);

    font-size: 20px;
}

/* 数字 */

.number {
    position: absolute;

    width: 100%;

    top: 43px;

    text-align: center;

    color: white;

    font-size: 25px;
    font-weight: 900;

    text-shadow:
        0 2px 4px rgba(184,61,111,.3);
}

/* 气球结 */

.balloon-knot {
    position: absolute;

    left: 45px;
    top: 108px;

    width: 0;
    height: 0;

    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 10px solid #ef619f;
}

/* 气球线 */

.balloon-string {
    position: absolute;

    width: 1.5px;
    height: 28px;

    left: 51px;
    top: 117px;

    background: #d98cac;

    transform: rotate(3deg);
}

@keyframes balloonFloat {
    0%,100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-9px) rotate(2deg);
    }
}

/* 爆炸 */

.balloon.popped {
    animation: balloonPop .4s forwards;
    pointer-events: none;
}

@keyframes balloonPop {

    0% {
        transform: scale(1);
        opacity: 1;
    }

    45% {
        transform: scale(1.25);
        opacity: .9;
    }

    100% {
        transform: scale(.05);
        opacity: 0;
    }
}

/* 星星 */

.spark {
    position: absolute;

    left: 50%;
    top: 45%;

    font-size: 23px;

    pointer-events: none;

    animation: sparkMove .7s ease-out forwards;
}

@keyframes sparkMove {

    0% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(180deg)
            scale(1.2);
    }
}

/* 底部 */

.bottom-tip {
    text-align: center;
    margin-top: 25px;

    font-size: 15px;

    color: #c47796;
}

/* 弹窗 */

.overlay {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(107,45,75,.28);

    backdrop-filter: blur(7px);

    opacity: 0;
    visibility: hidden;

    transition: .3s;

    z-index: 100;
}

.overlay.show {
    opacity: 1;
    visibility: visible;
}

.result {
    width: min(100%, 430px);

    padding: 38px 25px 30px;

    border-radius: 35px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #fff5fa 100%
        );

    border: 4px solid white;

    box-shadow:
        0 25px 70px rgba(129,52,87,.3);

    transform: scale(.7);

    transition:
        .35s cubic-bezier(.2,1.4,.4,1);
}

.overlay.show .result {
    transform: scale(1);
}

.result-icon {
    font-size: 58px;

    animation:
        resultBounce
        1s ease-in-out infinite;
}

@keyframes resultBounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}

.result h2 {
    margin-top: 8px;

    font-size: 27px;

    color: #ff659f;
}

.result-total {
    margin: 12px 0 24px;

    font-size: 38px;

    font-weight: 900;

    color: #ff5799;

    text-shadow:
        0 3px 0 #ffe0ec;
}

.confirm-btn {
    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 14px 20px;

    font-size: 18px;
    font-weight: 900;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #ff8fbc,
            #ff5e9f
        );

    box-shadow:
        0 8px 18px rgba(255,92,157,.28);

    transition: .2s;
}

.confirm-btn:hover {
    transform: translateY(-2px);
}

.confirm-btn:active {
    transform: scale(.97);
}

/* 彩带 */

.confetti {
    position: fixed;

    top: -20px;

    z-index: 200;

    pointer-events: none;

    animation:
        confettiFall
        2.8s linear forwards;
}

@keyframes confettiFall {

    0% {
        transform:
            translateY(-20px)
            rotate(0);

        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}

/* 手机 */

@media(max-width:650px) {

    .game {
        padding:
            18px 10px 30px;
    }

    .title {
        font-size: 38px;
    }

    .subtitle {
        font-size: 14px;
    }

    .status {
        padding: 10px 13px;
    }

    .hint {
        display: none;
    }

    .balloon-area {
        padding:
            22px 8px 28px;

        border-radius: 27px;
    }

    .balloons {
        grid-template-columns:
            repeat(4,1fr);

        gap: 20px 4px;
    }

    .balloon {
        width: 75px;
        height: 105px;
    }

    .balloon-body {
        width: 65px;
        height: 85px;
        left: 5px;
    }

    .number {
        top: 31px;
        font-size: 20px;
    }

    .balloon-knot {
        left: 32px;
        top: 82px;
    }

    .balloon-string {
        left: 38px;
        top: 91px;
        height: 20px;
    }

    .balloon-body::before {
        width: 15px;
        height: 29px;
        left: 12px;
        top: 11px;
    }

    .balloon-body::after {
        right: 9px;
        bottom: 13px;
        font-size: 15px;
    }

    .sound-btn {
        width: 43px;
        height: 43px;
        font-size: 19px;
        top: 12px;
        right: 12px;
    }
}
</style>
</head>

<body>

<div class="bg bg1">💗</div>
<div class="bg bg2">💕</div>
<div class="bg bg3">💖</div>
<div class="bg bg4">✨</div>

<!-- 音效按钮 -->
<button class="sound-btn" id="soundBtn" title="开启/关闭音效">
    🔊
</button>

<div class="game">

    <header class="header">

        <div class="title">
            🎈 气球抽奖
        </div>

        <div class="subtitle">
            选择你喜欢的气球，看看今天的好运气吧！
        </div>

    </header>

    <div class="status">

        <div class="counter">
            已选择
            <span id="selectedCount">0</span>
            / 10
        </div>

        <div class="hint" id="hint">
            还可以选择 10 个气球
        </div>

    </div>

    <div class="balloon-area">

        <div
            class="balloons"
            id="balloons">
        </div>

        <div class="bottom-tip">
            🎀 从 16 个气球中任选 10 个 🎀
        </div>

    </div>

</div>


<!-- 最终结果 -->

<div class="overlay" id="overlay">

    <div class="result">

        <div class="result-icon">
            🎉
        </div>

        <h2>
            恭喜你！
        </h2>

        <div class="result-total">
            获得
            <span id="total">0</span>
            钻石💎
        </div>

        <button
            class="confirm-btn"
            id="againBtn">

            再玩一次 🎈

        </button>

    </div>

</div>


<script>

/* =====================================
   游戏设置
===================================== */

const BALLOON_COUNT = 16;

const MAX_SELECT = 10;

const REWARDS = [
    1,
    5,
    10,
    20,
    30,
    50,
    70,
    100
];

let selected = 0;

let total = 0;

let soundEnabled = true;


/* =====================================
   DOM
===================================== */

const balloonsContainer =
    document.getElementById("balloons");

const selectedCount =
    document.getElementById("selectedCount");

const hint =
    document.getElementById("hint");

const overlay =
    document.getElementById("overlay");

const totalElement =
    document.getElementById("total");

const againBtn =
    document.getElementById("againBtn");

const soundBtn =
    document.getElementById("soundBtn");


/* =====================================
   音效系统
   不需要 MP3 文件
===================================== */

let audioContext = null;


/* 创建音频 */

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}


/* 播放音符 */

function playTone(
    frequency,
    duration = 0.12,
    type = "sine",
    volume = 0.08
) {

    if (!soundEnabled) return;

    const ctx = getAudioContext();

    if (!ctx) return;

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        ctx.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
        ctx.currentTime + duration
    );
}


/* 点击气球音 */

function balloonSound() {

    playTone(
        520,
        0.08,
        "sine",
        0.09
    );

    setTimeout(() => {

        playTone(
            760,
            0.1,
            "sine",
            0.07
        );

    }, 55);
}


/* 奖励音 */

function rewardSound() {

    playTone(
        880,
        0.12,
        "sine",
        0.07
    );

    setTimeout(() => {

        playTone(
            1175,
            0.18,
            "sine",
            0.08
        );

    }, 90);
}


/* 最终胜利音 */

function winSound() {

    const notes = [
        523,
        659,
        784,
        1046
    ];

    notes.forEach(
        (note,index) => {

            setTimeout(() => {

                playTone(
                    note,
                    0.25,
                    "sine",
                    0.09
                );

            }, index * 130);

        }
    );
}


/* =====================================
   音效开关
===================================== */

soundBtn.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        soundBtn.textContent =
            soundEnabled
                ? "🔊"
                : "🔇";

        if (soundEnabled) {

            playTone(
                880,
                0.12,
                "sine",
                0.07
            );

        }

    }
);


/* =====================================
   创建气球
===================================== */

function createBalloons() {

    balloonsContainer.innerHTML = "";

    selected = 0;

    total = 0;

    updateCounter();

    for (
        let i = 1;
        i <= BALLOON_COUNT;
        i++
    ) {

        const balloon =
            document.createElement("div");

        balloon.className =
            "balloon";

        balloon.innerHTML = `
            <div class="balloon-body"></div>
            <div class="number">${i}</div>
            <div class="balloon-knot"></div>
            <div class="balloon-string"></div>
        `;

        balloon.addEventListener(
            "click",
            () => {

                if (
                    balloon.classList.contains(
                        "popped"
                    )
                ) {
                    return;
                }

                if (
                    selected >= MAX_SELECT
                ) {
                    return;
                }

                popBalloon(balloon);

            }
        );

        balloonsContainer.appendChild(
            balloon
        );
    }
}


/* =====================================
   爆破气球
===================================== */

function popBalloon(balloon) {

    selected++;

    /* 随机奖励 */

    const reward =
        REWARDS[
            Math.floor(
                Math.random() *
                REWARDS.length
            )
        ];

    total += reward;

    /* 音效 */

    balloonSound();

    setTimeout(() => {
        rewardSound();
    }, 80);

    /* 爆炸效果 */

    createSparks(balloon);

    balloon.classList.add("popped");

    updateCounter();

    /* 第10次 */

    if (
        selected >= MAX_SELECT
    ) {

        disableRemaining();

        setTimeout(
            () => {

                showResult();

            },
            650
        );
    }
}


/* =====================================
   更新次数
===================================== */

function updateCounter() {

    selectedCount.textContent =
        selected;

    const remaining =
        MAX_SELECT - selected;

    if (remaining > 0) {

        hint.textContent =
            `还可以选择 ${remaining} 个气球`;

    } else {

        hint.textContent =
            "本轮抽奖完成啦！";
    }
}


/* =====================================
   禁止剩余气球
===================================== */

function disableRemaining() {

    const balloons =
        document.querySelectorAll(
            ".balloon"
        );

    balloons.forEach(
        balloon => {

            if (
                !balloon.classList.contains(
                    "popped"
                )
            ) {

                balloon.classList.add(
                    "disabled"
                );

                balloon.style.opacity =
                    ".45";

            }

        }
    );
}


/* =====================================
   爆炸粒子
===================================== */

function createSparks(balloon) {

    const symbols = [
        "✨",
        "💗",
        "💕",
        "⭐",
        "💎"
    ];

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";

        spark.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const x =
            (
                Math.random() *
                170 -
                85
            ) + "px";

        const y =
            (
                Math.random() *
                170 -
                85
            ) + "px";

        spark.style.setProperty(
            "--x",
            x
        );

        spark.style.setProperty(
            "--y",
            y
        );

        balloon.appendChild(
            spark
        );

        setTimeout(
            () => {
                spark.remove();
            },
            800
        );
    }
}


/* =====================================
   显示最终结果
===================================== */

function showResult() {

    totalElement.textContent =
        total;

    overlay.classList.add(
        "show"
    );

    winSound();

    createConfetti();
}


/* =====================================
   彩带
===================================== */

function createConfetti() {

    const items = [
        "💗",
        "💕",
        "✨",
        "🎀",
        "💎",
        "⭐"
    ];

    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const confetti =
            document.createElement(
                "div"
            );

        confetti.className =
            "confetti";

        confetti.textContent =
            items[
                Math.floor(
                    Math.random() *
                    items.length
                )
            ];

        confetti.style.left =
            Math.random() *
            100 +
            "vw";

        confetti.style.fontSize =
            (
                14 +
                Math.random() * 18
            ) +
            "px";

        confetti.style.animationDuration =
            (
                2 +
                Math.random() * 1.8
            ) +
            "s";

        document.body.appendChild(
            confetti
        );

        setTimeout(
            () => {
                confetti.remove();
            },
            4500
        );
    }
}


/* =====================================
   再玩一次
===================================== */

againBtn.addEventListener(
    "click",
    () => {

        overlay.classList.remove(
            "show"
        );

        setTimeout(
            () => {

                createBalloons();

            },
            250
        );

    }
);


/* =====================================
   启动
===================================== */

createBalloons();

</script>

</body>
</html>
