<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover,
      user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9fc5">

<title>幸运气球派对</title>

<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at 50% 5%, #fff 0%, #ffe9f2 22%, transparent 48%),
        linear-gradient(
            180deg,
            #ffb5d1 0%,
            #ff9fc5 32%,
            #ffb9d5 70%,
            #ffd7e7 100%
        );

    color:#8d4265;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 12%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 55%, rgba(255,255,255,.75) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 64%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 88%, rgba(255,255,255,.7) 0 2px, transparent 3px);

    opacity:.9;
}


/* =========================
   主容器
========================= */

.app{
    width:100%;
    max-width:980px;
    margin:0 auto;

    min-height:100vh;
    min-height:100dvh;

    padding:
        max(20px, env(safe-area-inset-top))
        14px
        max(28px, env(safe-area-inset-bottom));

    position:relative;
}


/* =========================
   两侧幕布
========================= */

.curtain{
    position:fixed;
    top:0;
    bottom:0;
    width:90px;

    pointer-events:none;
    z-index:0;

    background:
        linear-gradient(
            90deg,
            #d83c79 0%,
            #f56e9e 20%,
            #ff9fc4 48%,
            #ef5c94 72%,
            #c9316c 100%
        );

    opacity:.72;

    box-shadow:
        inset -8px 0 15px rgba(150,25,75,.18);
}

.curtain.left{
    left:0;
    border-radius:0 0 40px 0;
}

.curtain.right{
    right:0;
    transform:scaleX(-1);
    border-radius:0 0 40px 0;
}


/* =========================
   顶部灯光
========================= */

.lights{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);

    width:min(680px,82vw);

    display:flex;
    justify-content:space-between;

    z-index:2;
}

.lights span{
    width:8px;
    height:8px;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 15px rgba(255,255,255,.9);

    animation:blink 1.5s infinite alternate;
}

.lights span:nth-child(2){animation-delay:.15s}
.lights span:nth-child(3){animation-delay:.3s}
.lights span:nth-child(4){animation-delay:.45s}
.lights span:nth-child(5){animation-delay:.6s}
.lights span:nth-child(6){animation-delay:.75s}
.lights span:nth-child(7){animation-delay:.9s}
.lights span:nth-child(8){animation-delay:1.05s}

@keyframes blink{
    from{opacity:.45;transform:scale(.8)}
    to{opacity:1;transform:scale(1.25)}
}


/* =========================
   音效按钮
========================= */

.sound{
    position:absolute;
    top:48px;
    right:20px;

    width:45px;
    height:45px;

    border:2px solid rgba(255,255,255,.85);
    border-radius:50%;

    background:rgba(255,255,255,.55);

    box-shadow:
        0 5px 15px rgba(150,45,90,.15),
        inset 0 1px 0 white;

    font-size:20px;

    cursor:pointer;
    z-index:20;
}

.sound:active{
    transform:scale(.9);
}


/* =========================
   Hero
========================= */

.hero{
    position:relative;
    z-index:2;

    text-align:center;

    padding-top:32px;
}

.crown{
    font-size:38px;

    filter:
        drop-shadow(0 4px 3px rgba(150,60,90,.2));

    animation:
        crownFloat 2.2s ease-in-out infinite;
}

@keyframes crownFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
}

.badge{
    display:inline-block;

    margin-top:3px;
    padding:7px 18px;

    border-radius:30px;

    color:white;

    font-size:11px;
    font-weight:900;
    letter-spacing:2px;

    background:
        linear-gradient(
            180deg,
            #ffb5d4,
            #ed6e9e
        );

    border:2px solid rgba(255,255,255,.75);

    box-shadow:
        0 5px 15px rgba(150,40,85,.16),
        inset 0 1px 0 rgba(255,255,255,.9);
}

h1{
    margin:9px 0 4px;

    font-size:
        clamp(30px, 8vw, 52px);

    line-height:1.05;

    font-weight:1000;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
        0 3px 0 #ed709f,
        0 6px 12px rgba(142,45,86,.24);
}

.hero p{
    margin:8px 0 0;

    color:#fff;

    font-size:
        clamp(13px,3.5vw,16px);

    font-weight:700;

    text-shadow:
        0 2px 4px rgba(130,50,80,.18);
}


/* =========================
   数据面板
========================= */

.stage{
    position:relative;
    z-index:3;

    margin:18px auto 13px;

    width:min(760px,100%);

    padding:12px;

    border-radius:25px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.82),
            rgba(255,239,247,.82)
        );

    border:2px solid rgba(255,255,255,.85);

    box-shadow:
        0 12px 30px rgba(150,50,90,.15),
        inset 0 1px 0 white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:5px;

    border-radius:15px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff0f7
        );

    color:#a84d74;

    font-size:12px;
    font-weight:800;

    box-shadow:
        inset 0 1px 0 white;
}

.stat span{
    margin-left:3px;
    font-size:17px;
    color:#e95d91;
    font-weight:1000;
}

.progress{
    height:9px;

    margin:10px 3px 7px;

    border-radius:20px;

    background:#ffd8e8;

    overflow:hidden;

    box-shadow:
        inset 0 2px 4px rgba(160,50,90,.1);
}

.progress i{
    display:block;

    width:0%;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #f36d9e,
            #ff9dc1,
            #ef6b9b
        );

    box-shadow:
        0 0 8px rgba(240,90,145,.5);

    transition:width .4s ease;
}

.helper{
    text-align:center;

    font-size:12px;
    font-weight:800;

    color:#ba6388;
}


/* =========================
   气球区域
========================= */

.balloon-board{
    position:relative;
    z-index:3;

    width:min(760px,100%);

    margin:0 auto;

    padding:
        15px
        clamp(8px,2vw,20px)
        19px;

    border-radius:32px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.75),
            rgba(255,240,247,.85) 55%,
            rgba(255,220,235,.92)
        );

    border:3px solid rgba(255,255,255,.8);

    box-shadow:
        0 16px 35px rgba(150,45,90,.18),
        inset 0 1px 0 white;
}

.board-title{
    text-align:center;

    margin-bottom:8px;
}

.board-title span{
    display:inline-block;

    padding:6px 15px;

    border-radius:20px;

    background:rgba(255,255,255,.7);

    color:#d55789;

    font-size:13px;
    font-weight:900;

    box-shadow:
        0 4px 10px rgba(170,60,100,.08);
}


/* =========================
   16个气球
========================= */

.balloons{
    display:grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap:
        clamp(7px,2.2vw,18px)
        clamp(5px,2vw,15px);

    padding:
        6px
        clamp(2px,1vw,8px)
        4px;
}

.balloon{
    position:relative;

    height:
        clamp(126px, 18vw, 175px);

    display:flex;
    justify-content:center;
    align-items:flex-start;

    cursor:pointer;

    user-select:none;

    perspective:500px;

    transition:
        transform .18s ease,
        filter .18s ease;
}

.balloon:not(.pop):active{
    transform:scale(.92);
}

.balloon-body{

    position:relative;

    width:
        clamp(78px, 17vw, 116px);

    height:
        clamp(96px, 20vw, 142px);

    margin-top:2px;

    border-radius:
        53%
        53%
        49%
        49%
        /
        47%
        47%
        55%
        55%;

    background:

        radial-gradient(
            ellipse at 29% 20%,
            rgba(255,255,255,.98) 0%,
            rgba(255,255,255,.62) 8%,
            rgba(255,255,255,.08) 20%,
            transparent 28%
        ),

        radial-gradient(
            ellipse at 68% 72%,
            rgba(197,35,91,.22),
            transparent 52%
        ),

        linear-gradient(
            135deg,
            #ffb9d4 0%,
            #ff8fba 28%,
            #f65f99 58%,
            #e94b88 78%,
            #cf3273 100%
        );

    border:
        2px solid rgba(255,255,255,.72);

    box-shadow:

        inset
        -9px -12px 18px
        rgba(157,24,75,.20),

        inset
        8px 8px 15px
        rgba(255,255,255,.42),

        0 9px 13px
        rgba(150,35,85,.20);

    transform:
        rotate(var(--rotate,0deg));

    animation:
        balloonFloat 3s ease-in-out infinite;

    transition:
        transform .25s ease,
        filter .25s ease;
}

.balloon-body::before{
    content:"";

    position:absolute;

    left:16%;
    top:10%;

    width:18%;
    height:42%;

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.92),
            rgba(255,255,255,.12)
        );

    transform:rotate(14deg);

    filter:blur(.3px);
}

.balloon-body::after{
    content:"";

    position:absolute;

    right:14%;
    top:18%;

    width:8%;
    height:22%;

    border-radius:50%;

    background:
        rgba(255,255,255,.48);

    filter:blur(1px);
}

.balloon:nth-child(4n+1){
    --rotate:-3deg;
}

.balloon:nth-child(4n+2){
    --rotate:2deg;
    animation-delay:.35s;
}

.balloon:nth-child(4n+3){
    --rotate:-1deg;
    animation-delay:.7s;
}

.balloon:nth-child(4n){
    --rotate:3deg;
    animation-delay:1s;
}

@keyframes balloonFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-4px;
    }
}

.knot{
    position:absolute;

    top:
        clamp(94px, 19.5vw, 140px);

    width:17px;
    height:22px;

    background:
        linear-gradient(
            135deg,
            #ef6b9b,
            #c93470
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    filter:
        drop-shadow(
            0 2px 2px
            rgba(130,30,70,.2)
        );

    z-index:2;
}

.bow{
    position:absolute;

    top:
        clamp(104px, 21vw, 151px);

    width:36px;
    height:18px;

    z-index:4;
}

.bow::before,
.bow::after{
    content:"";

    position:absolute;

    top:1px;

    width:20px;
    height:16px;

    background:
        linear-gradient(
            135deg,
            #ff9fc4,
            #df3f78
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.6);
}

.bow::before{
    left:0;

    border-radius:
        90% 15% 70% 30%;
}

.bow::after{
    right:0;

    border-radius:
        15% 90% 30% 70%;
}

.bow-dot{
    position:absolute;

    left:50%;
    top:3px;

    transform:translateX(-50%);

    width:12px;
    height:12px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ff77a9 35%,
            #d93370
        );

    z-index:5;
}

.string{
    position:absolute;

    top:
        clamp(118px, 23vw, 167px);

    width:1.5px;

    height:17px;

    background:
        linear-gradient(
            180deg,
            #db6390,
            rgba(255,255,255,.7)
        );

    z-index:1;
}

.reward{

    position:absolute;

    left:50%;
    top:42%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    z-index:10;

    min-width:54px;

    padding:7px 10px;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #fffdfd,
            #fff0f7
        );

    color:#e34e87;

    border:2px solid white;

    font-size:
        clamp(12px,3vw,15px);

    font-weight:1000;

    box-shadow:
        0 5px 16px rgba(130,30,75,.2),
        0 0 14px rgba(255,255,255,.8);

    pointer-events:none;
}

.balloon.revealed .reward{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    transition:
        .35s cubic-bezier(.17,.89,.32,1.5);
}

.balloon.pop .balloon-body{

    animation:
        balloonPop .42s forwards;
}

.balloon.pop .knot,
.balloon.pop .bow,
.balloon.pop .string{

    animation:
        fadeAway .28s forwards;
}

@keyframes balloonPop{

    0%{
        transform:scale(1) rotate(var(--rotate));
        opacity:1;
    }

    45%{
        transform:scale(1.18) rotate(var(--rotate));
        opacity:.8;
    }

    100%{
        transform:scale(.05) rotate(var(--rotate));
        opacity:0;
    }
}

@keyframes fadeAway{

    to{
        opacity:0;
    }
}


/* =========================
   闪光粒子
========================= */

.spark{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:100;

    box-shadow:
        0 0 10px white,
        0 0 18px #ff75a8;

    animation:
        sparkFly .7s ease-out forwards;
}

@keyframes sparkFly{

    from{
        transform:
            translate(0,0)
            scale(1);
        opacity:1;
    }

    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity:0;
    }
}


/* =========================
   下方提示
========================= */

.note{
    position:relative;
    z-index:3;

    text-align:center;

    margin:11px auto;

    color:#fff;

    font-size:12px;
    font-weight:800;

    text-shadow:
        0 2px 4px rgba(120,40,75,.18);
}


/* =========================
   开奖按钮
========================= */

.gift{
    position:relative;
    z-index:4;

    display:block;

    width:min(420px,90%);

    margin:10px auto 0;

    padding:14px 22px;

    border:0;

    border-radius:30px;

    color:white;

    font-size:15px;
    font-weight:1000;

    background:
        linear-gradient(
            180deg,
            #ff9fc5,
            #e9568c
        );

    box-shadow:
        0 7px 0 #c83a72,
        0 13px 22px rgba(130,35,75,.22),
        inset 0 1px 0 rgba(255,255,255,.8);

    cursor:pointer;
}

.gift:active{
    transform:translateY(5px);

    box-shadow:
        0 2px 0 #c83a72,
        0 7px 13px rgba(130,35,75,.18);
}

.gift:disabled{
    opacity:.55;
}


/* =========================
   Footer
========================= */

.footer{
    position:relative;
    z-index:3;

    text-align:center;

    margin-top:16px;

    color:rgba(255,255,255,.9);

    font-size:11px;
    font-weight:700;
}


/* ==================================================
   倍数卡牌弹窗
================================================== */

.multiplier-overlay{

    position:fixed;

    inset:0;

    z-index:250;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        rgba(111,25,65,.48);

    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.multiplier-overlay.show{

    opacity:1;
    visibility:visible;
}

.multiplier-box{

    width:min(560px,94vw);

    padding:
        25px
        17px
        22px;

    border-radius:32px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff0f7
        );

    border:3px solid white;

    box-shadow:
        0 25px 65px rgba(80,15,45,.35);

    text-align:center;

    transform:
        scale(.7)
        translateY(30px);

    transition:
        transform .45s cubic-bezier(.17,.89,.32,1.35);
}

.multiplier-overlay.show .multiplier-box{

    transform:
        scale(1)
        translateY(0);
}

.multiplier-title{

    color:#df4d83;

    font-size:25px;

    font-weight:1000;

    margin-bottom:5px;
}

.multiplier-subtitle{

    color:#aa5a7c;

    font-size:13px;

    font-weight:800;

    margin-bottom:18px;
}

.base-reward{

    display:inline-block;

    padding:8px 17px;

    border-radius:20px;

    background:#ffe4ef;

    border:2px solid #ffc4da;

    color:#c34e79;

    font-size:14px;

    font-weight:900;

    margin-bottom:20px;
}


/* =========================
   4张隐藏卡牌
========================= */

.multiplier-cards{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    width:100%;
}

.multiplier-card{

    height:145px;

    position:relative;

    cursor:pointer;

    perspective:900px;

    user-select:none;

    /*
       新增：
       每张卡牌的跳动参数由 JS
       每一局随机生成
    */

    animation:
        multiplierRandomJump
        var(--jump-duration,1.4s)
        ease-in-out
        var(--jump-delay,0s)
        infinite;
}


/* =========================
   新增：卡牌随机跳动
========================= */

@keyframes multiplierRandomJump{

    0%,100%{

        transform:
            translate(0,0)
            rotate(0deg);

    }

    25%{

        transform:
            translate(
                var(--jump-x),
                calc(var(--jump-y) * -1)
            )
            rotate(
                var(--jump-rotate)
            );

    }

    50%{

        transform:
            translate(
                calc(var(--jump-x) * -1),
                var(--jump-y)
            )
            rotate(
                calc(var(--jump-rotate) * -1)
            );

    }

    75%{

        transform:
            translate(
                calc(var(--jump-x) * .5),
                calc(var(--jump-y) * -0.6)
            )
            rotate(
                calc(var(--jump-rotate) * .5)
            );

    }

}


/* 点击后停止随机跳动 */

.multiplier-card.flipped{

    cursor:default;

    animation:none !important;
}


/* 其他卡牌停止跳动 */

.multiplier-card.disabled-card{

    opacity:.35;

    pointer-events:none;

    transform:scale(.94);

    animation:none !important;
}


.card-inner{

    position:relative;

    width:100%;
    height:100%;

    transform-style:preserve-3d;

    transition:
        transform .65s
        cubic-bezier(.2,.75,.3,1.2);
}

.multiplier-card.flipped
.card-inner{

    transform:rotateY(180deg);
}

.card-front,
.card-back{

    position:absolute;

    inset:0;

    border-radius:20px;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;
}


/* 卡牌背面：隐藏内容 */

.card-front{

    background:
        linear-gradient(
            145deg,
            #ffb6d3,
            #ee5e96
        );

    border:3px solid white;

    box-shadow:
        0 8px 16px rgba(160,40,90,.2),
        inset 0 2px 0 rgba(255,255,255,.65);

    overflow:hidden;
}

.card-front::before{

    content:"";

    position:absolute;

    inset:8px;

    border:2px dashed rgba(255,255,255,.7);

    border-radius:14px;
}

.card-front::after{

    content:"🎀";

    position:absolute;

    font-size:34px;

    opacity:.95;

    filter:
        drop-shadow(
            0 3px 3px rgba(130,30,70,.18)
        );
}

.card-back{

    transform:rotateY(180deg);

    background:
        linear-gradient(
            180deg,
            #fff,
            #ffe5f0
        );

    border:3px solid #ffc1d9;

    box-shadow:

<script>

/* =========================
   游戏数据
========================= */

const rewards = [
    5,
    10,
    20,
    30,
    50,
    100,
    150,
    200
];


/*
   倍数卡牌
*/

const multipliers = [
    {
        value:1,
        text:"×1"
    },
    {
        value:1.5,
        text:"×1.5"
    },
    {
        value:2,
        text:"×2"
    },
    {
        value:0.5,
        text:"÷2"
    }
];


let selected = 0;

let total = 0;

let finalAmount = 0;

let selectedMultiplier = 1;

let soundOn = true;

let audio = null;


/* =========================
   DOM
========================= */

const balloonsBox =
    document.getElementById("balloons");

const countEl =
    document.getElementById("count");

const totalEl =
    document.getElementById("total");

const bar =
    document.getElementById("bar");

const helper =
    document.getElementById("helper");

const gift =
    document.getElementById("gift");

const overlay =
    document.getElementById("overlay");

const finalTotal =
    document.getElementById("finalTotal");

const again =
    document.getElementById("again");

const soundButton =
    document.getElementById("sound");

const multiplierOverlay =
    document.getElementById(
        "multiplierOverlay"
    );

const multiplierCards =
    document.getElementById(
        "multiplierCards"
    );

const baseReward =
    document.getElementById(
        "baseReward"
    );

const resultMultiplier =
    document.getElementById(
        "resultMultiplier"
    );


/* =========================
   音效
========================= */

function audioCtx(){

    if(!soundOn) return;

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audio.state === "suspended"){

        audio.resume();

    }

}


function playTone(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    if(!soundOn) return;

    audioCtx();

    if(!audio) return;

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );

}


function clickSound(){

    playTone(
        500,
        .08,
        "sine",
        .045
    );

}


function rewardSound(){

    playTone(
        720,
        .12,
        "sine",
        .05
    );

    setTimeout(()=>{

        playTone(
            980,
            .18,
            "sine",
            .045
        );

    },70);

}


function multiplierSound(){

    playTone(
        600,
        .1,
        "sine",
        .05
    );

    setTimeout(()=>{

        playTone(
            850,
            .12,
            "sine",
            .055
        );

    },90);

    setTimeout(()=>{

        playTone(
            1100,
            .22,
            "sine",
            .06
        );

    },180);

}


function victorySound(){

    if(!soundOn) return;

    [
        [523,.0],
        [659,.12],
        [784,.24],
        [1046,.38]
    ].forEach(([freq,delay])=>{

        setTimeout(()=>{

            playTone(
                freq,
                .28,
                "sine",
                .07
            );

        },delay * 1000);

    });

}


/* =========================
   震动
========================= */

function vibrate(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            12
        );

    }

}


/* =========================
   创建气球
========================= */

function createBalloon(){

    const balloon =
        document.createElement("div");

    balloon.className =
        "balloon";


    const body =
        document.createElement("div");

    body.className =
        "balloon-body";


    const knot =
        document.createElement("div");

    knot.className =
        "knot";


    const bow =
        document.createElement("div");

    bow.className =
        "bow";


    const bowDot =
        document.createElement("div");

    bowDot.className =
        "bow-dot";


    const string =
        document.createElement("div");

    string.className =
        "string";


    const reward =
        document.createElement("div");

    reward.className =
        "reward";


    bow.appendChild(
        bowDot
    );


    balloon.appendChild(
        body
    );

    balloon.appendChild(
        reward
    );

    balloon.appendChild(
        knot
    );

    balloon.appendChild(
        bow
    );

    balloon.appendChild(
        string
    );


    balloon.addEventListener(
        "click",
        ()=>{
            pickBalloon(balloon);
        }
    );


    return balloon;
}


/* =========================
   创建16个
========================= */

function makeBalloons(){

    balloonsBox.innerHTML="";

    for(
        let i=0;
        i<16;
        i++
    ){

        balloonsBox.appendChild(
            createBalloon()
        );

    }

}


/* =========================
   点击气球
========================= */

function pickBalloon(balloon){

    if(
        selected >= 10
    ) return;


    if(
        balloon.classList.contains("pop")
    ) return;


    audioCtx();

    vibrate();


    selected++;


    const reward =
        rewards[
            Math.floor(
                Math.random() *
                rewards.length
            )
        ];


    total += reward;


    const rewardEl =
        balloon.querySelector(
            ".reward"
        );


    rewardEl.textContent =
        "💎 " + reward;


    balloon.classList.add(
        "revealed"
    );


    setTimeout(()=>{

        balloon.classList.add(
            "pop"
        );

    },280);


    clickSound();


    setTimeout(
        rewardSound,
        80
    );


    createSparks(
        balloon
    );


    update();


    if(
        selected === 10
    ){

        gift.disabled = true;

        helper.textContent =
            "🎉 10 个幸运气球已经全部开启！";


        setTimeout(
            showMultiplierCards,
            900
        );

    }

}


/* =========================
   更新UI
========================= */

function update(){

    countEl.textContent =
        selected;

    totalEl.textContent =
        total;

    bar.style.width =
        (selected / 10 * 100) + "%";


    if(
        selected < 10
    ){

        helper.textContent =
            `还可以选择 ${10-selected} 个气球 ✨`;

    }

}


/* =========================
   闪光
========================= */

function createSparks(balloon){

    const rect =
        balloon.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height * .4;


    for(
        let i=0;
        i<14;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";


        spark.style.left =
            centerX + "px";

        spark.style.top =
            centerY + "px";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            35 +
            Math.random() *
            65;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            spark
        );


        setTimeout(
            ()=>{
                spark.remove();
            },
            800
        );

    }

}


/* ==================================================
   倍数卡牌
================================================== */

function showMultiplierCards(){

    baseReward.textContent =
        total;


    multiplierCards.innerHTML="";


    /*
       每一局重新随机排列。

       所以：
       ×1
       ×1.5
       ×2
       ÷2

       每次出现的位置都会不同。
    */

    const shuffled =
        [...multipliers]
        .sort(
            ()=>Math.random() - .5
        );


    shuffled.forEach(
        (item,index)=>{

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "multiplier-card";


            /*
               =====================================
               新增：
               每一张卡牌随机生成自己的跳动参数
               =====================================
            */


            /*
               跳动距离：
               6 ~ 13 px
            */

            const jumpX =
                4 +
                Math.random() * 8;

            const jumpY =
                6 +
                Math.random() * 9;


            /*
               随机旋转：
               2 ~ 5 度
            */

            const jumpRotate =
                2 +
                Math.random() * 3;


            /*
               随机速度：
               1.1 ~ 1.8 秒
            */

            const jumpDuration =
                1.1 +
                Math.random() * .7;


            /*
               随机开始时间：
               让4张卡不要同时跳
            */

            const jumpDelay =
                Math.random() * 1.2;


            card.style.setProperty(
                "--jump-x",
                jumpX + "px"
            );

            card.style.setProperty(
                "--jump-y",
                jumpY + "px"
            );

            card.style.setProperty(
                "--jump-rotate",
                jumpRotate + "deg"
            );

            card.style.setProperty(
                "--jump-duration",
                jumpDuration + "s"
            );

            card.style.setProperty(
                "--jump-delay",
                jumpDelay + "s"
            );


            /*
               重要：
               正面仍然完全隐藏倍率。
               玩家看到的只有 🎀。
            */

            card.innerHTML = `

                <div class="card-inner">

                    <div class="card-front">
                    </div>

                    <div class="card-back">

                        <div class="multiplier-value">
                            ${item.text}
                        </div>

                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                ()=>{
                    chooseMultiplier(
                        card,
                        item
                    );
                }
            );


            multiplierCards.appendChild(
                card
            );

        }
    );


    multiplierOverlay.classList.add(
        "show"
    );


    vibrate();

}

/* =========================
   选择倍数
========================= */

function chooseMultiplier(
    card,
    item
){

    /* 防止重复点击 */
    if(
        card.classList.contains("flipped")
    ) return;


    /*
       =========================
       第一阶段：
       选中的卡牌立即翻开
       =========================
    */

    card.classList.add("flipped");

    selectedMultiplier =
        item.value;


    /*
       计算最终钻石
    */

    finalAmount =
        total *
        selectedMultiplier;


    if(
        Number.isInteger(finalAmount)
    ){

        finalAmount =
            Math.round(
                finalAmount
            );

    }else{

        finalAmount =
            Math.round(
                finalAmount * 10
            ) / 10;

    }


    multiplierSound();

    vibrate();


    helper.textContent =
        `🎴 你抽中了 ${item.text}！`;


    /*
       =========================
       第二阶段：
       停留一下
       
       选中的卡牌翻开后，
       停留 1000ms
       =========================
    */

    setTimeout(()=>{


        const allCards =
            Array.from(
                multiplierCards.querySelectorAll(
                    ".multiplier-card"
                )
            );


        /*
           找出另外3张卡
        */

        const otherCards =
            allCards.filter(
                otherCard =>
                    otherCard !== card
            );


        /*
           =========================
           第三阶段：
           其他3张依次翻开
           
           每张间隔 400ms
           =========================
        */

        otherCards.forEach(
            (otherCard,index)=>{

                setTimeout(()=>{

                    otherCard.classList.add(
                        "flipped"
                    );


                    /*
                       每张卡翻开时播放一点音效
                    */

                    playTone(
                        650 + index * 100,
                        .12,
                        "sine",
                        .045
                    );


                    vibrate();


                }, index * 400);

            }
        );


        /*
           =========================
           第四阶段：
           等最后一张卡翻开
           
           最后一张：
           1000 + 800 = 1800ms
           
           再停留 1500ms
           =========================
        */

        setTimeout(()=>{


            /*
               确保4张卡全部翻开
            */

            allCards.forEach(
                otherCard=>{

                    otherCard.classList.add(
                        "flipped"
                    );

                }
            );


            /*
               =========================
               第五阶段：
               全部倍数显示后，
               再进入最终结果
               =========================
            */

            helper.textContent =
                `🎴 四张幸运倍数全部揭晓！你抽中 ${item.text}！`;


            setTimeout(()=>{


                multiplierOverlay.classList.remove(
                    "show"
                );


                /*
                   弹窗关闭后，
                   再稍微停顿一下
                */

                setTimeout(
                    showResult,
                    350
                );
