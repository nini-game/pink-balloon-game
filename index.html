```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9fc5">

<title>幸运气球派对</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 50% 5%,
            #ffffff 0%,
            #ffe8f2 20%,
            transparent 46%
        ),
        linear-gradient(
            180deg,
            #ffb5d2 0%,
            #ff9fc5 35%,
            #ffb9d5 70%,
            #ffd9e9 100%
        );

    color:#8d4265;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle at 12% 15%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 85% 12%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 18% 55%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 90% 64%,#fff 0 2px,transparent 3px);

    opacity:.8;
}

.app{
    width:100%;
    max-width:980px;
    min-height:100vh;
    margin:auto;

    padding:
        max(18px,env(safe-area-inset-top))
        12px
        max(30px,env(safe-area-inset-bottom));

    position:relative;
}

.curtain{
    position:fixed;
    top:0;
    bottom:0;
    width:78px;

    pointer-events:none;
    z-index:0;

    background:
        linear-gradient(
            90deg,
            #cf3272,
            #f66d9e 25%,
            #ffa3c7 50%,
            #ed5a94 75%,
            #c92d69
        );

    opacity:.65;
}

.curtain.left{
    left:0;
    border-radius:0 0 35px 0;
}

.curtain.right{
    right:0;
    transform:scaleX(-1);
    border-radius:0 0 35px 0;
}

.lights{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);

    width:min(650px,80vw);

    display:flex;
    justify-content:space-between;

    z-index:2;
}

.lights span{
    width:8px;
    height:8px;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 16px #fff;

    animation:
        blink 1.5s infinite alternate;
}

.lights span:nth-child(2){animation-delay:.15s}
.lights span:nth-child(3){animation-delay:.3s}
.lights span:nth-child(4){animation-delay:.45s}
.lights span:nth-child(5){animation-delay:.6s}
.lights span:nth-child(6){animation-delay:.75s}
.lights span:nth-child(7){animation-delay:.9s}
.lights span:nth-child(8){animation-delay:1.05s}

@keyframes blink{
    from{opacity:.4}
    to{
        opacity:1;
        transform:scale(1.25);
    }
}

.sound{
    position:absolute;

    right:17px;
    top:42px;

    width:43px;
    height:43px;

    border:2px solid #fff;
    border-radius:50%;

    background:#ffffff99;

    box-shadow:
        0 5px 15px #96345a26;

    font-size:19px;

    z-index:20;
}

.hero{
    position:relative;
    z-index:2;

    text-align:center;

    padding-top:28px;
}

.crown{
    font-size:36px;

    animation:
        float 2.2s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-5px);
    }
}

.badge{
    display:inline-block;

    margin-top:2px;

    padding:6px 17px;

    border-radius:30px;

    color:white;

    font-size:10px;
    font-weight:900;
    letter-spacing:2px;

    background:
        linear-gradient(
            #ffb6d5,
            #ed6b9d
        );

    border:2px solid #ffffffbb;

    box-shadow:
        0 5px 15px #96345a20;
}

h1{
    margin:8px 0 4px;

    font-size:
        clamp(29px,8vw,50px);

    line-height:1;

    font-weight:1000;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
        0 3px #e76b9a,
        0 6px 12px #8e2d561f;
}

.hero p{
    margin:8px 0;

    color:#fff;

    font-size:13px;
    font-weight:700;

    text-shadow:
        0 2px 4px #7a284018;
}

.stage{
    position:relative;
    z-index:3;

    width:min(760px,100%);

    margin:17px auto 12px;

    padding:11px;

    border-radius:24px;

    background:#ffffffd9;

    border:2px solid #ffffffd9;

    box-shadow:
        0 12px 30px #96325a20;
}

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;
}

.stat{
    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:4px;

    border-radius:14px;

    background:
        linear-gradient(
            #fff,
            #fff0f7
        );

    color:#a84d74;

    font-size:11px;
    font-weight:800;
}

.stat b{
    margin-left:3px;

    font-size:17px;

    color:#e64f87;
}

.progress{
    height:8px;

    margin:9px 3px 6px;

    border-radius:20px;

    background:#ffd8e8;

    overflow:hidden;
}

.progress i{
    display:block;

    width:0;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #f36d9e,
            #ff9dc1,
            #ef6b9b
        );

    transition:.4s;
}

.helper{
    text-align:center;

    font-size:12px;
    font-weight:800;

    color:#ba6388;
}


/* ==========================
   气球区域
========================== */

.balloon-board{
    position:relative;
    z-index:3;

    width:min(760px,100%);

    margin:auto;

    padding:
        13px
        8px
        17px;

    border-radius:30px;

    background:
        radial-gradient(
            circle at 50% 20%,
            #ffffffc9,
            #fff0f7db 55%,
            #ffdcead9
        );

    border:3px solid #ffffffcc;

    box-shadow:
        0 16px 35px #96325a2b;
}

.board-title{
    text-align:center;

    margin-bottom:5px;
}

.board-title span{
    display:inline-block;

    padding:6px 14px;

    border-radius:20px;

    background:#ffffffb8;

    color:#d55789;

    font-size:13px;
    font-weight:900;
}

.balloons{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:
        clamp(5px,1.8vw,15px)
        clamp(2px,1.5vw,12px);

    padding:5px 0;
}


/* ==========================
   大号饱满气球
========================== */

.balloon{
    position:relative;

    height:
        clamp(128px,20vw,180px);

    display:flex;
    justify-content:center;

    cursor:pointer;

    user-select:none;
}

.balloon-body{
    position:relative;

    width:
        clamp(79px,18vw,120px);

    height:
        clamp(99px,21vw,148px);

    margin-top:2px;

    border-radius:
        53% 53% 49% 49%
        /
        47% 47% 55% 55%;

    background:

        radial-gradient(
            ellipse at 29% 19%,
            #fff 0,
            rgba(255,255,255,.58) 8%,
            transparent 28%
        ),

        radial-gradient(
            ellipse at 68% 72%,
            rgba(197,35,91,.24),
            transparent 52%
        ),

        linear-gradient(
            135deg,
            #ffb9d4,
            #ff8fba 28%,
            #f65f99 58%,
            #e94b88 78%,
            #cf3273
        );

    border:
        2px solid #ffffffb8;

    box-shadow:

        inset
        -10px -13px 18px
        #9d184b33,

        inset
        8px 8px 15px
        #ffffff66,

        0 9px 13px
        #96235533;

    transform:
        rotate(var(--r,0deg));

    animation:
        balloonFloat 3s ease-in-out infinite;

    transition:.25s;
}

.balloon-body::before{
    content:"";

    position:absolute;

    left:16%;
    top:10%;

    width:18%;
    height:42%;

    border-radius:50%;

    background:
        linear-gradient(
            #ffffffe8,
            #ffffff1f
        );

    transform:rotate(14deg);
}

.balloon-body::after{
    content:"";

    position:absolute;

    right:14%;
    top:18%;

    width:8%;
    height:22%;

    border-radius:50%;

    background:#ffffff7a;

    filter:blur(1px);
}

.balloon:nth-child(4n+1){
    --r:-3deg;
}

.balloon:nth-child(4n+2){
    --r:2deg;
    animation-delay:.35s;
}

.balloon:nth-child(4n+3){
    --r:-1deg;
    animation-delay:.7s;
}

.balloon:nth-child(4n){
    --r:3deg;
    animation-delay:1s;
}

@keyframes balloonFloat{
    50%{
        margin-top:-4px;
    }
}

.balloon:active .balloon-body{
    transform:
        scale(.93)
        rotate(var(--r));
}

.knot{
    position:absolute;

    top:
        clamp(97px,20.5vw,146px);

    width:17px;
    height:22px;

    background:
        linear-gradient(
            135deg,
            #ef6b9b,
            #c93470
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    z-index:2;
}

.bow{
    position:absolute;

    top:
        clamp(107px,22vw,157px);

    width:36px;
    height:18px;

    z-index:4;
}

.bow::before,
.bow::after{
    content:"";

    position:absolute;

    top:1px;

    width:20px;
    height:16px;

    background:
        linear-gradient(
            135deg,
            #ff9fc4,
            #df3f78
        );
}

.bow::before{
    left:0;

    border-radius:
        90% 15% 70% 30%;
}

.bow::after{
    right:0;

    border-radius:
        15% 90% 30% 70%;
}

.bow-dot{
    position:absolute;

    left:50%;
    top:3px;

    transform:
        translateX(-50%);

    width:12px;
    height:12px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ff77a9 35%,
            #d93370
        );

    z-index:5;
}

.string{
    position:absolute;

    top:
        clamp(121px,24vw,173px);

    width:1.5px;
    height:17px;

    background:
        linear-gradient(
            #db6390,
            #ffffffb3
        );

    z-index:1;
}


/* ==========================
   奖励
========================== */

.reward{
    position:absolute;

    left:50%;
    top:42%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    z-index:10;

    min-width:53px;

    padding:7px 9px;

    border-radius:20px;

    background:
        linear-gradient(
            #fff,
            #fff0f7
        );

    color:#e34e87;

    border:2px solid white;

    font-size:13px;
    font-weight:1000;

    box-shadow:
        0 5px 16px #821e4b33,
        0 0 14px #ffffffcc;

    pointer-events:none;
}

.balloon.revealed .reward{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);

    transition:
        .35s
        cubic-bezier(.17,.89,.32,1.5);
}

.balloon.pop .balloon-body{
    animation:
        pop .42s forwards;
}

.balloon.pop .knot,
.balloon.pop .bow,
.balloon.pop .string{
    animation:
        fade .28s forwards;
}

@keyframes pop{
    45%{
        transform:
            scale(1.18)
            rotate(var(--r));

        opacity:.8;
    }

    100%{
        transform:
            scale(.05)
            rotate(var(--r));

        opacity:0;
    }
}

@keyframes fade{
    to{
        opacity:0;
    }
}


/* ==========================
   闪光
========================== */

.spark{
    position:fixed;

    width:7px;
    height:7px;

    border-radius:50%;

    background:white;

    pointer-events:none;

    z-index:100;

    box-shadow:
        0 0 10px white,
        0 0 18px #ff75a8;

    animation:
        spark .7s ease-out forwards;
}

@keyframes spark{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity:0;
    }
}


/* ==========================
   按钮
========================== */

.note{
    position:relative;
    z-index:3;

    text-align:center;

    margin:10px;

    color:white;

    font-size:12px;
    font-weight:800;
}

.gift{
    position:relative;
    z-index:4;

    display:block;

    width:min(420px,90%);

    margin:8px auto 0;

    padding:14px 22px;

    border:0;

    border-radius:30px;

    color:white;

    font-size:15px;
    font-weight:1000;

    background:
        linear-gradient(
            #ff9fc5,
            #e9568c
        );

    box-shadow:
        0 7px #c83a72,
        0 13px 22px #82234b38;

    cursor:pointer;
}

.gift:active{
    transform:translateY(5px);

    box-shadow:
        0 2px #c83a72;
}

.gift:disabled{
    opacity:.5;
}

.footer{
    position:relative;
    z-index:3;

    text-align:center;

    margin-top:15px;

    color:#ffffffe6;

    font-size:11px;
    font-weight:700;
}


/* ==========================
   倍率卡弹窗
========================== */

.card-overlay{
    position:fixed;

    inset:0;

    z-index:220;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:16px;

    background:
        #6f19416e;

    backdrop-filter:
        blur(9px);

    -webkit-backdrop-filter:
        blur(9px);

    opacity:0;
    visibility:hidden;

    transition:.3s;
}

.card-overlay.show{
    opacity:1;
    visibility:visible;
}

.card-panel{
    width:min(520px,95vw);

    text-align:center;

    padding:
        20px
        12px
        22px;

    border-radius:30px;

    background:
        linear-gradient(
            #fff,
            #fff0f7
        );

    border:3px solid #fff;

    box-shadow:
        0 25px 60px #500f2d4d;

    animation:
        panelIn .45s ease;
}

@keyframes panelIn{
    from{
        transform:
            scale(.75)
            translateY(30px);
    }

    to{
        transform:
            scale(1)
            translateY(0);
    }
}

.card-panel h2{
    margin:0;

    color:#db4d82;

    font-size:25px;
    font-weight:1000;
}

.card-panel p{
    margin:7px 0 14px;

    color:#a85a79;

    font-size:12px;
    font-weight:800;
}

.card-total{
    display:inline-block;

    margin-bottom:14px;

    padding:7px 15px;

    border-radius:20px;

    background:#ffe3ef;

    color:#df4d83;

    font-weight:1000;
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    max-width:500px;

    margin:auto;
}

.card{
    height:174px;

    perspective:900px;

    cursor:pointer;
}

.card-inner{
    position:relative;

    width:100%;
    height:100%;

    transform-style:preserve-3d;

    transition:
        transform
        .7s
        cubic-bezier(.2,.8,.2,1);
}

.card.flipped .card-inner{
    transform:
        rotateY(180deg);
}

.card-face{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    border-radius:18px;

    border:3px solid #fff;

    box-shadow:
        0 8px 15px #8e2d562b;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;
}


/* 卡牌背面 */

.card-back{
    background:
        radial-gradient(
            circle at 35% 25%,
            #fff8,
            #ffffff00 25%
        ),
        linear-gradient(
            145deg,
            #ffb1d0,
            #ed5b94 55%,
            #c93370
        );

    color:white;
}

.card-back .big{
    font-size:42px;

    filter:
        drop-shadow(
            0 4px 3px #8c255344
        );
}

.card-back span{
    margin-top:7px;

    font-size:11px;
    font-weight:1000;
    letter-spacing:1px;
}


/* 卡牌正面 */

.card-front{
    transform:
        rotateY(180deg);

    background:
        linear-gradient(
            #fff,
            #ffe5f0
        );

    color:#df4d83;
}

.card-front .symbol{
    font-size:38px;
}

.card-front strong{
    margin-top:8px;

    font-size:25px;
}

.card-front small{
    margin-top:3px;

    color:#b45d7e;

    font-size:10px;
    font-weight:800;
}

.card.chosen .card-front{
    box-shadow:
        0 0 0 4px #ffd35f,
        0 0 25px #ffd35f99,
        0 10px 20px #8e2d5633;
}

.card.bomb .card-front{
    background:
        linear-gradient(
            #fff7f7,
            #ffdede
        );

    color:#d94355;
}

.card.bomb .card-front strong{
    color:#d94355;
}

.card-hint{
    margin-top:14px;

    color:#bd6789;

    font-size:11px;
    font-weight:800;
}


/* ==========================
   最终结果
========================== */

.overlay{
    position:fixed;

    inset:0;

    z-index:300;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        #6f194165;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    opacity:0;
    visibility:hidden;

    transition:.3s;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}

.result{
    width:min(450px,94vw);

    padding:
        25px
        19px;

    border-radius:30px;

    text-align:center;

    background:
        linear-gradient(
            #fff,
            #fff1f7
        );

    border:3px solid white;

    box-shadow:
        0 25px 60px #500f2d4d;

    animation:
        resultIn .5s
        cubic-bezier(.17,.89,.32,1.35);
}

@keyframes resultIn{
    from{
        transform:
            scale(.65)
            translateY(30px);
    }

    to{
        transform:
            scale(1)
            translateY(0);
    }
}

.result .emoji{
    font-size:40px;
}

.result h2{
    margin:6px 0;

    color:#df4d83;

    font-size:25px;
    font-weight:1000;
}

.result p{
    margin:0 0 14px;

    color:#a85a79;

    font-size:12px;
    font-weight:700;
}

.totalBox{
    padding:14px;

    border-radius:20px;

    background:
        linear-gradient(
            #fff,
            #ffe3ef
        );

    border:2px solid #ffc1d9;

    color:#b25177;

    font-size:13px;
    font-weight:800;
}

.totalBox strong{
    display:inline-block;

    margin-top:4px;

    color:#e64d86;

    font-size:48px;

    line-height:1;
}

.again{
    width:100%;

    margin-top:14px;

    padding:13px;

    border:0;

    border-radius:25px;

    background:
        linear-gradient(
            #ff9fc4,
            #e9588c
        );

    color:white;

    font-size:15px;
    font-weight:1000;

    box-shadow:
        0 5px #c63b72,
        0 9px 18px #9628552e;
}


/* ==========================
   彩纸
========================== */

.confetti{
    position:fixed;

    top:-15px;

    width:8px;
    height:13px;

    z-index:400;

    pointer-events:none;

    animation:
        fall
        var(--d)
        linear
        forwards;
}

@keyframes fall{
    to{
        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(720deg);

        opacity:.8;
    }
}


/* ==========================
   小屏手机
========================== */

@media(max-width:390px){

    .curtain{
        width:52px;
    }

    .hero{
        padding-top:25px;
    }

    .stage{
        padding:9px;
    }

    .stat{
        font-size:9px;
    }

    .stat b{
        font-size:15px;
    }

    .balloons{
        gap:3px 1px;
    }

    .balloon{
        height:119px;
    }

    .balloon-body{
        width:71px;
        height:91px;
    }

    .knot{
        top:88px;
    }

    .bow{
        top:97px;
    }

    .string{
        top:110px;
    }

    .card{
        height:145px;
    }

    .card-back .big{
        font-size:34px;
    }

    .card-front .symbol{
        font-size:30px;
    }

    .card-front strong{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="lights">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <button class="sound" id="sound">🔊</button>

    <header class="hero">

        <div class="crown">👑</div>

        <div class="badge">
            🎀 TODAY'S LUCKY 🎀
        </div>

        <h1>
            幸运气球派对
        </h1>

        <p>
            选择 10 个气球，赢取你的幸运钻石！
        </p>

    </header>


    <section class="stage">

        <div class="stats">

            <div class="stat">
                本局钻石 💎
                <b id="total">0</b>
            </div>

            <div class="stat">
                已选择
                <b id="count">0</b>/10
            </div>

            <div class="stat">
                单颗最高 💎
                <b>200</b>
            </div>

        </div>

        <div class="progress">
            <i id="bar"></i>
        </div>

        <div class="helper" id="helper">
            从下面 16 个气球中任选 10 个 ✨
        </div>

    </section>


    <section class="balloon-board">

        <div class="board-title">
            <span>
                🎈 挑选你的幸运气球 🎈
            </span>
        </div>

        <div
            class="balloons"
            id="balloons">
        </div>

    </section>


    <div class="note">
        💗 每个气球都有机会获得 5～200 💎 💗
    </div>


    <button
        class="gift"
        id="gift">

        🎁 选择 10 个气球开奖

    </button>


    <div class="footer">
        🎀 幸运气球派对 · 愿你今天好运满满 🎀
    </div>

</div>


<!-- ==========================
     倍率卡
========================== -->

<div
    class="card-overlay"
    id="cardOverlay">

    <div class="card-panel">

        <h2>
            🎴 幸运倍率卡 🎴
        </h2>

        <p>
            10 个气球全部打开啦！<br>
            选择一张神秘卡决定最终钻石。
        </p>

        <div class="card-total">
            当前钻石：
            <b id="cardTotal">0</b>
            💎
        </div>

        <div
            class="cards"
            id="cards">
        </div>

        <div class="card-hint">
            每局卡牌位置都会随机 · 选中后才会翻开
        </div>

    </div>

</div>


<!-- ==========================
     最终结果
========================== -->

<div
    class="overlay"
    id="overlay">

    <div class="result">

        <div class="emoji">
            👑🎉🎈
        </div>

        <h2>
            恭喜你，幸运星！
        </h2>

        <p>
            幸运倍率卡已经揭晓！
        </p>

        <div class="totalBox">

            最终获得

            <br>

            <strong id="finalTotal">
                0
            </strong>

            💎

        </div>

        <button
            class="again"
            id="again">

            再来一轮 🎈

        </button>

    </div>

</div>


<script>

/* ==========================
   游戏规则
========================== */

const rewards = [
    5,
    10,
    20,
    30,
    50,
    100,
    200
];


/*
    四张倍率卡

    1     = ×1
    1.5   = ×1.5
    2     = ×2
    bomb  = ÷2
*/

const multipliers = [
    "1",
    "1.5",
    "2",
    "bomb"
];


let selected = 0;
let total = 0;

let soundOn = true;
let audio = null;

let cardLocked = false;


/* ==========================
   DOM
========================== */

const balloonsBox =
    document.getElementById("balloons");

const countEl =
    document.getElementById("count");

const totalEl =
    document.getElementById("total");

const bar =
    document.getElementById("bar");

const helper =
    document.getElementById("helper");

const gift =
    document.getElementById("gift");

const overlay =
    document.getElementById("overlay");

const finalTotal =
    document.getElementById("finalTotal");

const again =
    document.getElementById("again");

const soundButton =
    document.getElementById("sound");

const cardOverlay =
    document.getElementById("cardOverlay");

const cardsBox =
    document.getElementById("cards");

const cardTotal =
    document.getElementById("cardTotal");


/* ==========================
   音效
========================== */

function audioCtx(){

    if(!soundOn)
        return;

    if(!audio){

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audio.state === "suspended"
    ){

        audio.resume();

    }

}


function tone(
    frequency,
    duration,
    volume=.05
){

    if(!soundOn)
        return;

    audioCtx();

    if(!audio)
        return;

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );
}


function clickSound(){

    tone(
        500,
        .08,
        .045
    );

}


function rewardSound(){

    tone(
        720,
        .12,
        .05
    );

    setTimeout(
        ()=>{
            tone(
                980,
                .18,
                .045
            );
        },
        70
    );

}


function victorySound(){

    [
        523,
        659,
        784,
        1046
    ].forEach(
        (frequency,index)=>{

            setTimeout(
                ()=>{
                    tone(
                        frequency,
                        .28,
                        .07
                    );
                },
                index * 120
            );

        }
    );

}


/* ==========================
   震动
========================== */

function vibrate(
    time=12
){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            time
        );

    }

}


/* ==========================
   创建气球
========================== */

function createBalloon(){

    const balloon =
        document.createElement(
            "div"
        );

    balloon.className =
        "balloon";


    balloon.innerHTML = `

        <div class="balloon-body"></div>

        <div class="reward"></div>

        <div class="knot"></div>

        <div class="bow">
            <div class="bow-dot"></div>
        </div>

        <div class="string"></div>

    `;


    balloon.addEventListener(
        "click",
        ()=>{
            pickBalloon(
                balloon
            );
        }
    );


    return balloon;
}


/* ==========================
   创建16个气球
========================== */

function makeBalloons(){

    balloonsBox.innerHTML = "";

    for(
        let i=0;
        i<16;
        i++
    ){

        balloonsBox.appendChild(
            createBalloon()
        );

    }

}


/* ==========================
   点击气球
========================== */

function pickBalloon(
    balloon
){

    if(
        selected >= 10
    )
        return;

    if(
        balloon.classList.contains(
            "pop"
        )
    )
        return;


    audioCtx();

    vibrate();


    selected++;


    const reward =
        rewards[
            Math.floor(
                Math.random() *
                rewards.length
            )
        ];


    total += reward;


    const rewardEl =
        balloon.querySelector(
            ".reward"
        );


    rewardEl.textContent =
        "💎 " + reward;


    balloon.classList.add(
        "revealed"
    );


    setTimeout(
        ()=>{
            balloon.classList.add(
                "pop"
            );
        },
        280
    );


    clickSound();

    setTimeout(
        rewardSound,
        80
    );


    createSparks(
        balloon
    );


    update();


    if(
        selected === 10
    ){

        gift.disabled =
            true;

        helper.textContent =
            "🎉 10 个幸运气球全部开启！";

        setTimeout(
            openCards,
            900
        );

    }

}


/* ==========================
   更新
========================== */

function update(){

    countEl.textContent =
        selected;

    totalEl.textContent =
        total;

    bar.style.width =
        (
            selected / 10 * 100
        ) + "%";


    if(
        selected < 10
    ){

        helper.textContent =
            `还可以选择 ${10-selected} 个气球 ✨`;

    }

}


/* ==========================
   闪光
========================== */

function createSparks(
    element
){

    const rect =
        element.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height * .4;


    for(
        let i=0;
        i<14;
        i++
    ){

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";


        spark.style.left =
            centerX + "px";

        spark.style.top =
            centerY + "px";


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            35 +
            Math.random() *
            65;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            spark
        );


        setTimeout(
            ()=>{
                spark.remove();
            },
            800
        );

    }

}


/* ==========================
   随机排序
========================== */

function shuffle(
    array
){

    return array.sort(
        ()=>{
            return Math.random() - .5;
        }
    );

}


/* ==========================
   打开倍率卡
========================== */

function openCards(){

    cardTotal.textContent =
        total;

    cardsBox.innerHTML =
        "";

    cardLocked =
        false;


    cardOverlay.classList.add(
        "show"
    );


    const deck =
        shuffle(
            [
                ...multipliers
            ]
        );


    deck.forEach(
        type => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";


            let front;


            if(
                type === "bomb"
            ){

                front = `

                    <div class="card-front">

                        <div class="symbol">
                            💣
                        </div>

                        <strong>
                            ÷2
                        </strong>

                        <small>
                            炸弹！钻石减半
                        </small>

                    </div>

                `;

            }else{

                front = `

                    <div class="card-front">

                        <div class="symbol">
                            💎
                        </div>

                        <strong>
                            ×${type}
                        </strong>

                        <small>
                            幸运倍率
                        </small>

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="card-inner">

                    <div class="card-face card-back">

                        <div class="big">
                            🎴
                        </div>

                        <span>
                            神秘卡
                        </span>

                    </div>

                    ${front}

                </div>

            `;


            card.addEventListener(
                "click",
                ()=>{
                    chooseCard(
                        card,
                        type
                    );
                }
            );


            cardsBox.appendChild(
                card
            );

        }
    );

}


/* ==========================
   选择倍率卡
========================== */

function chooseCard(
    card,
    type
){

    if(cardLocked)
        return;


    if(
        card.classList.contains(
            "flipped"
        )
    )
        return;


    cardLocked =
        true;


    card.classList.add(
        "flipped",
        "chosen"
    );


    if(
        type === "bomb"
    ){

        card.classList.add(
            "bomb"
        );

    }


    vibrate(25);


    if(
        type === "bomb"
    ){

        tone(
            220,
            .2,
            .08
        );

    }else{

        tone(
            800,
            .16,
            .06
        );

    }


    setTimeout(
        ()=>{

            let final;


            if(
                type === "bomb"
            ){

                /*
                    炸弹 ÷2
                */

                final =
                    total / 2;

            }

            else if(
                type === "1.5"
            ){

                /*
                    总数 ×1.5
                */

                final =
                    total * 1.5;

            }

            else if(
                type === "2"
            ){

                /*
                    总数 ×2
                */

                final =
                    total * 2;

            }

            else{

                /*
                    ×1
                */

                final =
                    total;

            }


            /*
                如果出现小数，
                自动四舍五入。
            */

            final =
                Math.round(
                    final
                );


            setTimeout(
                ()=>{
                    showResult(
                        final
                    );
                },
                700
            );

        },
        700
    );

}


/* ==========================
   最终结果
========================== */

function showResult(
    final
){

    cardOverlay.classList.remove(
        "show"
    );


    finalTotal.textContent =
        final;


    overlay.classList.add(
        "show"
    );


    victorySound();

    vibrate(30);

    createConfetti();

}


/* ==========================
   彩纸
========================== */

function createConfetti(){

    for(
        let i=0;
        i<55;
        i++
    ){

        const confetti =
            document.createElement(
                "div"
            );

        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() *
            100 +
            "vw";


        confetti.style.setProperty(
            "--x",
            (
                Math.random()*200 -
                100
            ) + "px"
        );


        confetti.style.setProperty(
            "--d",
            (
                1.8 +
                Math.random()*2
            ) + "s"
        );


        confetti.style.background =
            [
                "#ff6f9f",
                "#ff9fc5",
                "#ffd36f",
                "#fff",
                "#d85bff"
            ][
                Math.floor(
                    Math.random()*5
                )
            ];


        document.body.appendChild(
            confetti
        );


        setTimeout(
            ()=>{
                confetti.remove();
            },
            4500
        );

    }

}


/* ==========================
   重新开始
========================== */

function resetGame(){

    selected =
        0;

    total =
        0;

    cardLocked =
        false;

    gift.disabled =
        false;


    overlay.classList.remove(
        "show"
    );

    cardOverlay.classList.remove(
        "show"
    );


    makeBalloons();

    update();

}


/* ==========================
   按钮
========================== */

gift.addEventListener(
    "click",
    ()=>{

        if(
            selected === 10
        ){

            openCards();

        }

    }
);


again.addEventListener(
    "click",
    resetGame
);


soundButton.addEventListener(
    "click",
    ()=>{

        soundOn =
            !soundOn;


        soundButton.textContent =
            soundOn
            ? "🔊"
            : "🔇";


        if(soundOn){

            audioCtx();

            tone(
                700,
                .1
            );

        }

    }
);


/* ==========================
   初始化
========================== */

makeBalloons();

update();


document.addEventListener(
    "dblclick",
    event=>{
        event.preventDefault();
    },
    {
        passive:false
    }
);

</script>

</body>
</html>
